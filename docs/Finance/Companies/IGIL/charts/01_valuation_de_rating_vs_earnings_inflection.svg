<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 580" width="100%" height="100%" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="patBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="targetZone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.32"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1050" height="580" rx="14" fill="url(#bgGrad1)" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="42" fill="#f8fafc" font-size="20" font-weight="700">IGIL Valuation Arc: Post-IPO De-Rating (50x &#8594; 22.5x P/E) vs. Earnings Inflection &amp; Stage 2 Breakout</text>
  <text x="36" y="65" fill="#94a3b8" font-size="13">While the stock price corrected -45% in 2025 to wash out IPO valuation froth, PAT compounded steadily (+37% YoY in H1 FY27), setting up the ₹500–₹580 re-rating.</text>

  <!-- Legend -->
  <rect x="36" y="80" width="14" height="14" rx="3" fill="url(#patBar)" stroke="#10b981"/>
  <text x="56" y="92" fill="#cbd5e1" font-size="12" font-weight="600">Annual / Run-Rate PAT (₹ Cr)</text>
  <line x1="250" y1="87" x2="280" y2="87" stroke="#f59e0b" stroke-width="3.5"/>
  <circle cx="265" cy="87" r="5" fill="#f59e0b"/>
  <text x="288" y="92" fill="#cbd5e1" font-size="12" font-weight="600">Stock Price Trajectory (₹/Share) &amp; P/E Multiple</text>
  <line x1="590" y1="87" x2="620" y2="87" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="628" y="92" fill="#38bdf8" font-size="12" font-weight="600">200-Day Moving Average (Stage Filter)</text>

  <!-- Stage Background Zones -->
  <!-- Stage 3 Zone -->
  <rect x="90" y="115" width="155" height="365" fill="#ef4444" fill-opacity="0.07" stroke="#ef4444" stroke-opacity="0.25" stroke-dasharray="4,4"/>
  <text x="167" y="135" fill="#fca5a5" font-size="11" font-weight="700" text-anchor="middle">STAGE 3: IPO EUPHORIA</text>
  <text x="167" y="150" fill="#f87171" font-size="10" text-anchor="middle">(50x–55x P/E Bubble)</text>

  <!-- Stage 4 Zone -->
  <rect x="245" y="115" width="185" height="365" fill="#f97316" fill-opacity="0.06" stroke="#f97316" stroke-opacity="0.25" stroke-dasharray="4,4"/>
  <text x="337" y="135" fill="#fdba74" font-size="11" font-weight="700" text-anchor="middle">STAGE 4: DE-RATING</text>
  <text x="337" y="150" fill="#fb923c" font-size="10" text-anchor="middle">(Below 200-DMA; ARP -2.6%)</text>

  <!-- Stage 1 Base Zone -->
  <rect x="430" y="115" width="175" height="365" fill="#eab308" fill-opacity="0.07" stroke="#eab308" stroke-opacity="0.3" stroke-dasharray="4,4"/>
  <text x="517" y="135" fill="#fde047" font-size="11" font-weight="700" text-anchor="middle">STAGE 1: ACCUMULATION BASE</text>
  <text x="517" y="150" fill="#facc15" font-size="10" text-anchor="middle">(₹287–₹340 Box @ ~22.5x P/E)</text>

  <!-- Stage 2 Breakout Zone -->
  <rect x="605" y="115" width="365" height="365" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-dasharray="4,4"/>
  <text x="787" y="135" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">STAGE 2: BREAKOUT &amp; RE-RATING REGIME</text>
  <text x="787" y="150" fill="#34d399" font-size="10" text-anchor="middle">(Q1/Q2 FY27 Earnings Surge &#8594; ₹415 CMP &#8594; ₹500–₹580 Target)</text>

  <!-- Grid Lines (Y-axis Price: 200 to 600; Y=480 is 200, Y=160 is 600 -> 0.8px per Rs) -->
  <g stroke="#334155" stroke-width="1">
    <line x1="90" y1="480" x2="970" y2="480"/>
    <line x1="90" y1="400" x2="970" y2="400" stroke-dasharray="3,3"/>
    <line x1="90" y1="320" x2="970" y2="320" stroke-dasharray="3,3"/>
    <line x1="90" y1="240" x2="970" y2="240" stroke-dasharray="3,3"/>
    <line x1="90" y1="160" x2="970" y2="160" stroke-dasharray="3,3"/>
  </g>

  <!-- Left Y-Axis Labels (Stock Price) -->
  <text x="80" y="484" fill="#94a3b8" font-size="11" text-anchor="end">₹200</text>
  <text x="80" y="404" fill="#94a3b8" font-size="11" text-anchor="end">₹300</text>
  <text x="80" y="324" fill="#94a3b8" font-size="11" text-anchor="end">₹400</text>
  <text x="80" y="244" fill="#94a3b8" font-size="11" text-anchor="end">₹500</text>
  <text x="80" y="164" fill="#94a3b8" font-size="11" text-anchor="end">₹600</text>
  <text x="28" y="320" fill="#f59e0b" font-size="12" font-weight="700" transform="rotate(-90 28,320)" text-anchor="middle">Stock Price (₹ / Share)</text>

  <!-- Right Y-Axis Labels (PAT in Cr: 200 to 1000) -->
  <text x="980" y="484" fill="#6ee7b7" font-size="11">₹200 Cr</text>
  <text x="980" y="404" fill="#6ee7b7" font-size="11">₹400 Cr</text>
  <text x="980" y="324" fill="#6ee7b7" font-size="11">₹600 Cr</text>
  <text x="980" y="244" fill="#6ee7b7" font-size="11">₹800 Cr</text>
  <text x="980" y="164" fill="#6ee7b7" font-size="11">₹1,000 Cr</text>
  <text x="1035" y="320" fill="#10b981" font-size="12" font-weight="700" transform="rotate(90 1035,320)" text-anchor="middle">Consolidated PAT (₹ Crore)</text>

  <!-- IPO Issue Price Reference Line (Rs 417 -> Y = 306) -->
  <line x1="90" y1="306" x2="970" y2="306" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="8,4" stroke-opacity="0.5"/>
  <rect x="96" y="285" width="136" height="17" rx="3" fill="#0f172a" fill-opacity="0.9"/>
  <text x="102" y="297" fill="#e2e8f0" font-size="9.5" font-weight="600">IPO Price: ₹417 (Dec '24)</text>

  <!-- PAT Bars (7 time points: X = 140, 260, 380, 500, 625, 760, 895) -->
  <!-- 1. Dec '24 IPO (CY24 PAT: 427.3 Cr -> Y=389, H=91) -->
  <rect x="112" y="389" width="56" height="91" rx="4" fill="url(#patBar)" stroke="#10b981" stroke-width="1.2"/>
  <text x="140" y="408" fill="#ecfdf5" font-size="11" font-weight="700" text-anchor="middle">₹427 Cr</text>
  <text x="140" y="422" fill="#a7f3d0" font-size="9.5" text-anchor="middle">CY24 PAT</text>

  <!-- 2. H1 CY25 (Run-rate PAT ~490 Cr -> Y=364, H=116) -->
  <rect x="232" y="364" width="56" height="116" rx="4" fill="url(#patBar)" stroke="#10b981" stroke-width="1.2"/>
  <text x="260" y="383" fill="#ecfdf5" font-size="11" font-weight="700" text-anchor="middle">~₹490 Cr</text>
  <text x="260" y="397" fill="#a7f3d0" font-size="9.5" text-anchor="middle">H1 CY25 Ann.</text>

  <!-- 3. Full Year CY25 (PAT: 531.6 Cr -> Y=347, H=133) -->
  <rect x="352" y="347" width="56" height="133" rx="4" fill="url(#patBar)" stroke="#10b981" stroke-width="1.2"/>
  <text x="380" y="366" fill="#ecfdf5" font-size="11" font-weight="700" text-anchor="middle">₹532 Cr</text>
  <text x="380" y="380" fill="#a7f3d0" font-size="9.5" text-anchor="middle">CY25 (+24%)</text>

  <!-- 4. Q1 FY27 (Jun '26 PAT: 165.7 Cr = 663 Cr Ann. -> Y=295, H=185) -->
  <rect x="472" y="295" width="56" height="185" rx="4" fill="url(#patBar)" stroke="#10b981" stroke-width="1.2"/>
  <text x="500" y="314" fill="#ecfdf5" font-size="11" font-weight="700" text-anchor="middle">₹663 Cr</text>
  <text x="500" y="328" fill="#a7f3d0" font-size="9.5" text-anchor="middle">Q1'27 Run-Rate</text>

  <!-- 5. Q2 FY27 (Sep '26 PAT: 185.84 Cr = 743 Cr Ann. -> Y=263, H=217) -->
  <rect x="597" y="263" width="56" height="217" rx="4" fill="url(#patBar)" stroke="#10b981" stroke-width="1.5"/>
  <text x="625" y="282" fill="#ecfdf5" font-size="11" font-weight="700" text-anchor="middle">₹743 Cr</text>
  <text x="625" y="296" fill="#a7f3d0" font-size="9.5" text-anchor="middle">Q2'27 Run-Rate</text>

  <!-- 6. Full Year FY27E Projected (PAT: 725 Cr -> Y=270, H=210) -->
  <rect x="732" y="270" width="56" height="210" rx="4" fill="url(#patBar)" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="760" y="289" fill="#ecfdf5" font-size="11" font-weight="700" text-anchor="middle">₹725 Cr</text>
  <text x="760" y="303" fill="#a7f3d0" font-size="9.5" text-anchor="middle">FY27E (EPS ₹16.8)</text>

  <!-- 7. Full Year FY28E Projected (PAT: 855 Cr -> Y=218, H=262) -->
  <rect x="867" y="218" width="56" height="262" rx="4" fill="url(#patBar)" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="895" y="242" fill="#ecfdf5" font-size="11" font-weight="700" text-anchor="middle">₹855 Cr</text>
  <text x="895" y="256" fill="#a7f3d0" font-size="9.5" text-anchor="middle">FY28E (EPS ₹19.8)</text>

  <!-- 200-DMA Curve -->
  <path d="M 240,260 Q 340,325 430,355 T 605,358 Q 700,342 895,270" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Target Price Band (2027-28: Rs 500 to Rs 580 -> Y=162 to Y=210) -->
  <rect x="745" y="160" width="215" height="48" rx="8" fill="url(#targetZone)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="852" y="180" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">2027–28 Target: ₹500 – ₹580</text>
  <text x="852" y="196" fill="#93c5fd" font-size="10" text-anchor="middle">(Only 25.2x–29x FY28E EPS of ₹19.80!)</text>

  <!-- Stock Price Line -->
  <polyline points="140,200 260,312 380,360 500,388 625,321 700,304" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <polyline points="700,304 895,208" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-dasharray="7,5"/>

  <!-- Data Nodes & Callout Badges on Stock Price Line -->
  <!-- Point 1: Post-IPO Peak -->
  <circle cx="140" cy="200" r="6" fill="#ef4444" stroke="#fff" stroke-width="2"/>
  <rect x="96" y="162" width="110" height="30" rx="5" fill="#1e293b" stroke="#ef4444" filter="url(#shadow)"/>
  <text x="151" y="176" fill="#fca5a5" font-size="10.5" font-weight="700" text-anchor="middle">₹550+ Peak</text>
  <text x="151" y="188" fill="#cbd5e1" font-size="9.5" text-anchor="middle">~52x P/E (Froth)</text>

  <!-- Point 2: Mid-2025 De-rating -->
  <circle cx="260" cy="312" r="5" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
  <text x="275" y="330" fill="#fde68a" font-size="10" font-weight="600" text-anchor="middle">~₹410 (~34x P/E)</text>

  <!-- Point 3: End CY25 -->
  <circle cx="380" cy="360" r="5" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
  <text x="380" y="340" fill="#fde68a" font-size="10" font-weight="600" text-anchor="middle">~₹350 (~28x P/E)</text>

  <!-- Point 4: Stage 1 Trough Base -->
  <circle cx="500" cy="388" r="6.5" fill="#eab308" stroke="#fff" stroke-width="2"/>
  <rect x="432" y="400" width="136" height="34" rx="5" fill="#1e293b" stroke="#eab308" filter="url(#shadow)"/>
  <text x="500" y="414" fill="#fde047" font-size="10.5" font-weight="700" text-anchor="middle">₹287 Low / ₹320 Base</text>
  <text x="500" y="427" fill="#cbd5e1" font-size="9.5" text-anchor="middle">22.5x P/E (Our Initial Call)</text>

  <!-- Point 5: Q2 Beat Oct '26 -->
  <circle cx="625" cy="321" r="5.5" fill="#10b981" stroke="#fff" stroke-width="2"/>

  <!-- Point 6: Nov '26 CMP Breakout -->
  <circle cx="700" cy="304" r="7" fill="#10b981" stroke="#fff" stroke-width="2"/>
  <rect x="575" y="210" width="155" height="36" rx="5" fill="#064e3b" stroke="#10b981" filter="url(#shadow)"/>
  <text x="652" y="225" fill="#6ee7b7" font-size="10.5" font-weight="700" text-anchor="middle">Nov '26: ₹415 (High ₹440)</text>
  <text x="652" y="238" fill="#ecfdf5" font-size="9.5" text-anchor="middle">24.5x FY27E | 20.8x FY28E P/E</text>
  <line x1="665" y1="246" x2="700" y2="296" stroke="#10b981" stroke-width="1.5"/>

  <!-- Point 7: Target Midpoint -->
  <circle cx="895" cy="208" r="6.5" fill="#38bdf8" stroke="#fff" stroke-width="2"/>

  <!-- X-Axis Labels -->
  <text x="140" y="502" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Dec '24 – Jan '25</text>
  <text x="140" y="516" fill="#94a3b8" font-size="10" text-anchor="middle">(IPO Listing)</text>

  <text x="260" y="502" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Mid-2025</text>
  <text x="260" y="516" fill="#94a3b8" font-size="10" text-anchor="middle">(Europe Integrated)</text>

  <text x="380" y="502" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Q4 CY25</text>
  <text x="380" y="516" fill="#94a3b8" font-size="10" text-anchor="middle">(ARP Dip Fear)</text>

  <text x="500" y="502" fill="#fde047" font-size="11" font-weight="700" text-anchor="middle">Mid-2026 (Q1'27)</text>
  <text x="500" y="516" fill="#facc15" font-size="10" text-anchor="middle">(ARP ₹1,010 Rebound)</text>

  <text x="625" y="502" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">Oct–Nov '26 (Q2'27)</text>
  <text x="625" y="516" fill="#34d399" font-size="10" text-anchor="middle">(Record 61.4% Margin)</text>

  <text x="760" y="502" fill="#93c5fd" font-size="11" font-weight="600" text-anchor="middle">Full Year FY27E</text>
  <text x="760" y="516" fill="#60a5fa" font-size="10" text-anchor="middle">(Mar 2027)</text>

  <text x="895" y="502" fill="#93c5fd" font-size="11" font-weight="700" text-anchor="middle">FY28E Target</text>
  <text x="895" y="516" fill="#60a5fa" font-size="10" text-anchor="middle">(MPS Block Catalyst)</text>

  <!-- Footer Key Takeaway Strip -->
  <rect x="36" y="532" width="978" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="525" y="552" fill="#e2e8f0" font-size="10.8" text-anchor="middle">
    <tspan fill="#38bdf8" font-weight="700">Core Insight:</tspan> Between Dec 2024 and Mid-2026, IGIL's run-rate PAT grew +55% (₹427 Cr &#8594; ₹663 Cr) while the stock fell -45%. That P/E compression created the springboard for the Stage 2 rally.
  </text>
</svg>
