  <text x="484" y="343" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="end">1.32% Stake (Sovereign Wealth)</text>

  <!-- Pill 3: ADIA -->
  <rect x="68" y="364" width="428" height="34" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="80" y="385" fill="#f8fafc" font-size="11" font-weight="700">Abu Dhabi Inv. Authority (ADIA)</text>
  <text x="484" y="385" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="end">1.11% Stake (Sovereign Wealth)</text>

