  <rect x="50" y="218" width="465" height="240" rx="10" fill="#0f172a" fill-opacity="0.7" stroke="#334155"/>
  <text x="68" y="245" fill="#6ee7b7" font-size="13.5" font-weight="700">2. Marquee Sovereign, Endowment &amp; MF Register (&gt;1%)</text>
  <text x="68" y="264" fill="#94a3b8" font-size="10.8">These 5–10 year holders lock up ~22% of the entire non-promoter public float:</text>

