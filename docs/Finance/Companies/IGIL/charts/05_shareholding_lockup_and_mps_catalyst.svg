    </linearGradient>
  </defs>

  <rect width="1050" height="490" rx="14" fill="url(#bgGrad5)" stroke="#334155" stroke-width="1.5"/>

  <text x="36" y="42" fill="#f8fafc" font-size="20" font-weight="700">The 90.82% Institutional Lock-Up &amp; Dec 2027 SEBI 75% MPS Catalyst (43.21 Cr Shares)</text>
  <text x="36" y="64" fill="#94a3b8" font-size="13">As of Q2 FY27 (Sep 30, 2026), only 9.18% of IGIL is in public/retail hands—creating a tight float today and a passive index inclusion catalyst in 2027.</text>

  <!-- Horizontal Stacked Bar of 100% Ownership -->
  <text x="50" y="102" fill="#e2e8f0" font-size="13" font-weight="700">1. Current Shareholding Structure (Q2 FY27 / Sep 30, 2026 — Total: 43.21 Crore Shares)</text>

  <rect x="50" y="114" width="727" height="54" rx="6" fill="#3b82f6" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="413" y="138" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">Promoter: Blackstone (BCP Asia II TopCo) — 76.55% (33.08 Cr Shares | 0% Pledged)</text>
  <text x="413" y="156" fill="#dbeafe" font-size="11" text-anchor="middle">Must reduce below 75.00% by Dec 19, 2027 (SEBI 3-Yr MPS Rule)</text>

  <rect x="779" y="114" width="84" height="54" rx="4" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>
  <text x="821" y="138" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">FIIs: 8.80%</text>
  <text x="821" y="154" fill="#d1fae5" font-size="10" text-anchor="middle">(3.80 Cr)</text>

  <rect x="865" y="114" width="52" height="54" rx="4" fill="#8b5cf6" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="891" y="138" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">DIIs</text>
  <text x="891" y="154" fill="#ede9fe" font-size="10" font-weight="700" text-anchor="middle">5.47%</text>

  <rect x="919" y="114" width="81" height="54" rx="4" fill="#f59e0b" stroke="#fde047" stroke-width="1.5"/>
  <text x="959" y="138" fill="#0f172a" font-size="11.5" font-weight="800" text-anchor="middle">Retail Float</text>
  <text x="959" y="154" fill="#0f172a" font-size="11" font-weight="800" text-anchor="middle">Only 9.18%!</text>

  <!-- Bracket showing 90.82% Institutional Lock-up -->
  <path d="M 50,176 L 50,186 L 917,186 L 917,176" fill="none" stroke="#34d399" stroke-width="2"/>
  <rect x="340" y="177" width="280" height="22" rx="4" fill="#064e3b" stroke="#10b981"/>
  <text x="480" y="192" fill="#6ee7b7" font-size="11.5" font-weight="800" text-anchor="middle">90.82% Locked in Institutional Hands (39.24 Cr Sh)</text>

