  <text x="484" y="427" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="end">1.00%+ Stake (US Endowment)</text>

  <!-- Right Card: Game Theory of the Dec 2027 MPS Block Deal -->
  <rect x="530" y="218" width="470" height="240" rx="10" fill="#0f172a" fill-opacity="0.7" stroke="#334155"/>
  <text x="548" y="245" fill="#fde047" font-size="13.5" font-weight="700">3. The Dec 2027 SEBI 75% MPS &amp; Index Inclusion Catalyst</text>

  <rect x="548" y="264" width="434" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="562" y="284" fill="#93c5fd" font-size="11.5" font-weight="700">Step 1: Alignment Window (₹415 &#8594; ₹480–₹520+)</text>
  <text x="562" y="301" fill="#cbd5e1" font-size="10.3">Blackstone wants maximum EBITDA, high dividends &amp; higher stock price before selling.</text>

  <rect x="548" y="326" width="434" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="562" y="346" fill="#fde047" font-size="11.5" font-weight="700">Step 2: 10%–15% Institutional Block Deal (Before Dec 19, 2027)</text>
  <text x="562" y="363" fill="#cbd5e1" font-size="9.6">Instead of 1.55%, PE typically places a 10%–15% block (~₹2,200–3,000 Cr) with FIIs/DIIs.</text>

  <rect x="548" y="388" width="434" height="52" rx="6" fill="#064e3b" stroke="#10b981"/>
  <text x="562" y="408" fill="#6ee7b7" font-size="11.5" font-weight="700">Step 3: Free Float Jumps &gt;50% &#8594; Passive MSCI / FTSE / Nifty Buying!</text>
  <text x="562" y="425" fill="#ecfdf5" font-size="9.6">Dropping below 75% promoter holding unlocks mandatory passive index inflows &amp; 35x+ P/E.</text>
