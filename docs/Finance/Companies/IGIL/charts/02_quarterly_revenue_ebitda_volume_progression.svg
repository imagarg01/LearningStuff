<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 540" width="100%" height="100%" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="revGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="ebitdaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="volGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <rect width="1050" height="540" rx="14" fill="url(#bgGrad2)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="36" y="40" fill="#f8fafc" font-size="20" font-weight="700">IGIL Operating Momentum: Quarterly Revenue, EBITDA Margin &amp; Volume Acceleration</text>
  <text x="36" y="62" fill="#94a3b8" font-size="13">Q2 FY27 (Ended Sep 30, 2026) delivered all-time record volume (4.35M reports, +26% YoY), Revenue (₹398 Cr, +31% YoY), and EBITDA Margin (61.4%).</text>

  <!-- LEFT PANEL: Quarterly Revenue, EBITDA & PAT + EBITDA Margin % -->
  <rect x="30" y="80" width="510" height="400" rx="10" fill="#0f172a" fill-opacity="0.6" stroke="#334155"/>
  <text x="50" y="108" fill="#e2e8f0" font-size="14" font-weight="700">Panel A: Quarterly P&amp;L Progression (₹ Crore) &amp; Margin %</text>

  <!-- Legend Left Panel -->
  <rect x="50" y="120" width="11" height="11" rx="2" fill="url(#revGrad)"/>
  <text x="66" y="130" fill="#cbd5e1" font-size="11">Revenue (₹ Cr)</text>
  <rect x="165" y="120" width="11" height="11" rx="2" fill="url(#ebitdaGrad)"/>
  <text x="181" y="130" fill="#cbd5e1" font-size="11">EBITDA (₹ Cr)</text>
  <line x1="280" y1="125" x2="305" y2="125" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="292" cy="125" r="4" fill="#f59e0b"/>
  <text x="312" y="130" fill="#f59e0b" font-size="11" font-weight="600">EBITDA Margin %</text>

  <!-- Grid Left Panel -->
  <g stroke="#334155" stroke-width="1">
    <line x1="65" y1="420" x2="515" y2="420"/>
    <line x1="65" y1="364" x2="515" y2="364" stroke-dasharray="3,3"/>
    <line x1="65" y1="309" x2="515" y2="309" stroke-dasharray="3,3"/>
    <line x1="65" y1="253" x2="515" y2="253" stroke-dasharray="3,3"/>
    <line x1="65" y1="198" x2="515" y2="198" stroke-dasharray="3,3"/>
  </g>
  <text x="58" y="424" fill="#64748b" font-size="10" text-anchor="end">0</text>
  <text x="58" y="368" fill="#64748b" font-size="10" text-anchor="end">₹100</text>
  <text x="58" y="313" fill="#64748b" font-size="10" text-anchor="end">₹200</text>
  <text x="58" y="257" fill="#64748b" font-size="10" text-anchor="end">₹300</text>
  <text x="58" y="202" fill="#64748b" font-size="10" text-anchor="end">₹400</text>

  <!-- Q1 FY26 -->
  <rect x="82" y="253" width="24" height="167" rx="3" fill="url(#revGrad)"/>
  <rect x="108" y="324" width="24" height="96" rx="3" fill="url(#ebitdaGrad)"/>
  <text x="94" y="246" fill="#93c5fd" font-size="10" font-weight="600" text-anchor="middle">301</text>
  <text x="120" y="318" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">174</text>
  <text x="107" y="438" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">Q1 FY26</text>
  <text x="107" y="451" fill="#64748b" font-size="9.5" text-anchor="middle">(Jun '25)</text>

  <!-- Q2 FY26 -->
  <rect x="167" y="251" width="24" height="169" rx="3" fill="url(#revGrad)"/>
  <rect x="193" y="322" width="24" height="98" rx="3" fill="url(#ebitdaGrad)"/>
  <text x="179" y="244" fill="#93c5fd" font-size="10" font-weight="600" text-anchor="middle">304</text>
  <text x="205" y="316" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">176</text>
  <text x="192" y="438" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">Q2 FY26</text>
  <text x="192" y="451" fill="#64748b" font-size="9.5" text-anchor="middle">(Sep '25)</text>

  <!-- Q4 CY25 -->
  <rect x="252" y="242" width="24" height="178" rx="3" fill="url(#revGrad)"/>
  <rect x="278" y="314" width="24" height="106" rx="3" fill="url(#ebitdaGrad)"/>
  <text x="264" y="235" fill="#93c5fd" font-size="10" font-weight="600" text-anchor="middle">320</text>
  <text x="290" y="308" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">191</text>
  <text x="277" y="438" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">Q4 CY25</text>
  <text x="277" y="451" fill="#64748b" font-size="9.5" text-anchor="middle">(Dec '25)</text>

  <!-- Q1 FY27 -->
  <rect x="337" y="214" width="24" height="206" rx="3" fill="url(#revGrad)"/>
  <rect x="363" y="296" width="24" height="124" rx="3" fill="url(#ebitdaGrad)"/>
  <text x="349" y="207" fill="#93c5fd" font-size="10.5" font-weight="700" text-anchor="middle">371</text>
  <text x="375" y="290" fill="#6ee7b7" font-size="10.5" font-weight="700" text-anchor="middle">224</text>
  <text x="362" y="438" fill="#e2e8f0" font-size="10.5" font-weight="700" text-anchor="middle">Q1 FY27</text>
  <text x="362" y="451" fill="#94a3b8" font-size="9.5" text-anchor="middle">(Jun '26)</text>

  <!-- Q2 FY27 -->
  <rect x="427" y="199" width="26" height="221" rx="3" fill="url(#revGrad)" stroke="#60a5fa" stroke-width="1.2"/>
  <rect x="455" y="284" width="26" height="136" rx="3" fill="url(#ebitdaGrad)" stroke="#34d399" stroke-width="1.2"/>
  <text x="438" y="191" fill="#eff6ff" font-size="10.5" font-weight="700" text-anchor="middle">398 Cr</text>
  <text x="472" y="277" fill="#ecfdf5" font-size="10.5" font-weight="700" text-anchor="middle">245 Cr</text>
  <text x="454" y="438" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">Q2 FY27</text>
  <text x="454" y="451" fill="#34d399" font-size="9.5" font-weight="600" text-anchor="middle">(Sep '26 Record)</text>

  <!-- EBITDA Margin Line -->
  <polyline points="107,210 192,206 277,185 362,174 454,158" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="107" cy="210" r="4.5" fill="#f59e0b"/>
  <text x="107" y="198" fill="#fde68a" font-size="10" font-weight="600" text-anchor="middle">57.7%</text>
  <circle cx="192" cy="206" r="4.5" fill="#f59e0b"/>
  <text x="192" y="194" fill="#fde68a" font-size="10" font-weight="600" text-anchor="middle">58.0%</text>
  <circle cx="277" cy="185" r="4.5" fill="#f59e0b"/>
  <text x="277" y="173" fill="#fde68a" font-size="10" font-weight="600" text-anchor="middle">59.8%</text>
  <circle cx="362" cy="174" r="4.5" fill="#f59e0b"/>
  <text x="362" y="162" fill="#fde68a" font-size="10.5" font-weight="700" text-anchor="middle">60.4%</text>
  <circle cx="454" cy="158" r="6" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
  <text x="454" y="145" fill="#fef08a" font-size="11" font-weight="700" text-anchor="middle">61.4% (+340 bps)</text>

  <!-- RIGHT PANEL: Certification Volume (Millions) & Segment YoY Drivers -->
  <rect x="555" y="80" width="465" height="400" rx="10" fill="#0f172a" fill-opacity="0.6" stroke="#334155"/>
  <text x="575" y="108" fill="#e2e8f0" font-size="14" font-weight="700">Panel B: Volume Scaling &amp; Q2 FY27 Segment Growth Drivers</text>

  <!-- Top Half of Right Panel: Volume Bars -->
  <text x="575" y="132" fill="#94a3b8" font-size="11.5" font-weight="600">Quarterly Grading Reports Delivered (Millions) &amp; ARP (₹)</text>
  <line x1="575" y1="265" x2="995" y2="265" stroke="#334155" stroke-width="1"/>

  <!-- Q2 FY26: 3.45M -->
  <rect x="595" y="178" width="52" height="87" rx="4" fill="url(#volGrad)" opacity="0.75"/>
  <text x="621" y="171" fill="#ddd6fe" font-size="11" font-weight="700" text-anchor="middle">3.45M</text>
  <text x="621" y="218" fill="#e2e8f0" font-size="9.5" text-anchor="middle">ARP: ₹881</text>
  <text x="621" y="281" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Q2 FY26</text>

  <!-- Q4 CY25: 3.21M -->
  <rect x="695" y="184" width="52" height="81" rx="4" fill="url(#volGrad)" opacity="0.8"/>
  <text x="721" y="177" fill="#ddd6fe" font-size="11" font-weight="700" text-anchor="middle">3.21M</text>
  <text x="721" y="222" fill="#e2e8f0" font-size="9.5" text-anchor="middle">ARP: ₹950</text>
  <text x="721" y="281" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Q4 CY25</text>

  <!-- Q1 FY27: 3.56M -->
  <rect x="795" y="175" width="52" height="90" rx="4" fill="url(#volGrad)" opacity="0.9"/>
  <text x="821" y="168" fill="#ddd6fe" font-size="11" font-weight="700" text-anchor="middle">3.56M</text>
  <text x="821" y="215" fill="#fde047" font-size="9.5" font-weight="700" text-anchor="middle">ARP: ₹1,010</text>
  <text x="821" y="281" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">Q1 FY27</text>

  <!-- Q2 FY27: 4.35M -->
  <rect x="895" y="152" width="58" height="113" rx="4" fill="url(#volGrad)" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="924" y="144" fill="#f5f3ff" font-size="12" font-weight="700" text-anchor="middle">4.35M (+26%)</text>
  <text x="924" y="198" fill="#fde047" font-size="9.5" font-weight="700" text-anchor="middle">ARP: ₹915 Tot</text>
  <text x="924" y="212" fill="#e2e8f0" font-size="9" text-anchor="middle">(₹891 Cert +4%)</text>
  <text x="924" y="281" fill="#c4b5fd" font-size="10.5" font-weight="700" text-anchor="middle">Q2 FY27</text>

  <!-- Bottom Half of Right Panel: Q2 FY27 Segment YoY Growth Horizontal Bars -->
  <line x1="575" y1="302" x2="995" y2="302" stroke="#334155" stroke-width="1"/>
  <text x="575" y="322" fill="#e2e8f0" font-size="12.5" font-weight="700">Q2 FY27 Volume &amp; Revenue Growth by Segment (YoY %)</text>

  <!-- Bar 1: LGD Studded Jewelry (+47% YoY) -->
  <text x="575" y="348" fill="#cbd5e1" font-size="11" font-weight="600">LGD Studded Jewelry</text>
  <rect x="720" y="336" width="215" height="16" rx="3" fill="#10b981"/>
  <text x="942" y="348" fill="#6ee7b7" font-size="11" font-weight="700">+47% YoY</text>

  <!-- Bar 2: Loose LGD Stones (+37% YoY) -->
  <text x="575" y="375" fill="#cbd5e1" font-size="11" font-weight="600">Loose LGD Stones</text>
  <rect x="720" y="363" width="170" height="16" rx="3" fill="#3b82f6"/>
  <text x="897" y="375" fill="#93c5fd" font-size="11" font-weight="700">+37% YoY</text>

  <!-- Bar 3: International Labs ex-AGL (+31% YoY) -->
  <text x="575" y="402" fill="#cbd5e1" font-size="11" font-weight="600">Overseas Labs (ex-AGL)</text>
  <rect x="720" y="390" width="142" height="16" rx="3" fill="#8b5cf6"/>
  <text x="869" y="402" fill="#c4b5fd" font-size="11" font-weight="700">+31% YoY</text>

  <!-- Bar 4: Natural Loose Diamonds (+8% YoY) -->
  <text x="575" y="429" fill="#cbd5e1" font-size="11" font-weight="600">Natural Loose Diamonds</text>
  <rect x="720" y="417" width="42" height="16" rx="3" fill="#f59e0b"/>
  <text x="770" y="429" fill="#fde68a" font-size="11" font-weight="700">+8% YoY</text>

  <!-- Bar 5: Colored Gemstones (AGL) -->
  <text x="575" y="456" fill="#cbd5e1" font-size="11" font-weight="600">Colored Stones (AGL NY)</text>
  <rect x="720" y="444" width="235" height="16" rx="3" fill="#ec4899"/>
  <text x="837" y="456" fill="#fdf2f8" font-size="10" font-weight="700" text-anchor="middle">Multi-Fold Surge (Consolidated Feb '26)</text>

  <!-- Footer H1 Summary Strip -->
  <rect x="30" y="492" width="990" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="525" y="513" fill="#e2e8f0" font-size="10.3" text-anchor="middle">
    <tspan fill="#6ee7b7" font-weight="700">H1 FY27 Cumulative (Apr–Sep '26):</tspan> Vol: 7.91M (+22.1% YoY) &#160;|&#160; Rev: ₹768.8 Cr (+27.1% YoY) &#160;|&#160; EBITDA: ₹468.3 Cr (+33.9% YoY, 60.9% Margin) &#160;|&#160; PAT: ₹351.6 Cr (+37.2% YoY) &#160;|&#160; CFO: ₹415.7 Cr (88.8% of EBITDA)
  </text>
</svg>
