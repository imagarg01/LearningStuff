<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 480" width="100%" height="100%" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="1050" height="480" rx="14" fill="url(#bgGrad4)" stroke="#334155" stroke-width="1.5"/>

  <text x="36" y="42" fill="#f8fafc" font-size="20" font-weight="700">Atomic Unit Economics: Waterfall of a Single IGI Grading Report (H1 FY27 Blended)</text>
  <text x="36" y="64" fill="#94a3b8" font-size="13">Zero raw material cost + salaried Indian gemologists (~21% of revenue) = ₹592 cash EBITDA per certificate and ~75% incremental margin on new volume.</text>

  <!-- Grid -->
  <g stroke="#334155" stroke-width="1">
    <line x1="85" y1="380" x2="975" y2="380"/>
    <line x1="85" y1="315" x2="975" y2="315" stroke-dasharray="3,3"/>
    <line x1="85" y1="250" x2="975" y2="250" stroke-dasharray="3,3"/>
    <line x1="85" y1="185" x2="975" y2="185" stroke-dasharray="3,3"/>
    <line x1="85" y1="120" x2="975" y2="120" stroke-dasharray="3,3"/>
  </g>
  <text x="75" y="384" fill="#94a3b8" font-size="11" text-anchor="end">₹0</text>
  <text x="75" y="319" fill="#94a3b8" font-size="11" text-anchor="end">₹250</text>
  <text x="75" y="254" fill="#94a3b8" font-size="11" text-anchor="end">₹500</text>
  <text x="75" y="189" fill="#94a3b8" font-size="11" text-anchor="end">₹750</text>
  <text x="75" y="124" fill="#94a3b8" font-size="11" text-anchor="end">₹1,000</text>

  <!-- Step 1: Blended Unit Revenue (ARP) = ₹972 -->
  <rect x="115" y="127" width="110" height="253" rx="5" fill="#3b82f6" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="170" y="116" fill="#93c5fd" font-size="14" font-weight="800" text-anchor="middle">₹972 (100%)</text>
  <text x="170" y="245" fill="#eff6ff" font-size="11" font-weight="600" text-anchor="middle">Q1: ₹1,010</text>
  <text x="170" y="262" fill="#eff6ff" font-size="11" font-weight="600" text-anchor="middle">Q2: ₹915 Tot</text>
  <text x="170" y="278" fill="#dbeafe" font-size="10" text-anchor="middle">(₹891 Cert)</text>
  <text x="170" y="404" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">1. Unit Revenue</text>
  <text x="170" y="420" fill="#94a3b8" font-size="10.5" text-anchor="middle">(H1 FY27 Blended ARP)</text>

  <!-- Connector 1 -> 2 -->
  <line x1="225" y1="127" x2="280" y2="127" stroke="#94a3b8" stroke-dasharray="3,3"/>

  <!-- Step 2: Direct Gemologist Labor = -₹207 -->
  <rect x="280" y="127" width="110" height="54" rx="5" fill="#ef4444" stroke="#f87171" stroke-width="1.5"/>
  <text x="335" y="116" fill="#fca5a5" font-size="13.5" font-weight="700" text-anchor="middle">-₹207 (21.3%)</text>
  <text x="335" y="158" fill="#fef2f2" font-size="10.5" font-weight="600" text-anchor="middle">India Labor Arb.</text>
  <text x="335" y="404" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">2. Direct Labor</text>
  <text x="335" y="420" fill="#94a3b8" font-size="10.5" text-anchor="middle">(Salaried Gemologists)</text>

  <!-- Connector 2 -> 3 -->
  <line x1="390" y1="181" x2="445" y2="181" stroke="#94a3b8" stroke-dasharray="3,3"/>

  <!-- Step 3: Lab Tech, Spectroscopy & Overhead = -₹173 -->
  <rect x="445" y="181" width="110" height="45" rx="5" fill="#f97316" stroke="#fb923c" stroke-width="1.5"/>
  <text x="500" y="171" fill="#fdba74" font-size="13.5" font-weight="700" text-anchor="middle">-₹173 (17.8%)</text>
  <text x="500" y="208" fill="#fff7ed" font-size="10.5" font-weight="600" text-anchor="middle">Lab &amp; AI Tech</text>
  <text x="500" y="404" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">3. Lab Overhead</text>
  <text x="500" y="420" fill="#94a3b8" font-size="10.5" text-anchor="middle">(Rent, Admin, Other)</text>

  <!-- Connector 3 -> 4 -->
  <line x1="555" y1="226" x2="610" y2="226" stroke="#94a3b8" stroke-dasharray="3,3"/>

  <!-- Step 4: Unit Operating EBITDA = ₹592 -->
  <rect x="610" y="226" width="120" height="154" rx="5" fill="#10b981" stroke="#34d399" stroke-width="2"/>
  <text x="670" y="214" fill="#6ee7b7" font-size="14.5" font-weight="800" text-anchor="middle">₹592 (60.9%)</text>
  <text x="670" y="295" fill="#ecfdf5" font-size="11" font-weight="700" text-anchor="middle">61.4% in Q2'27</text>
  <text x="670" y="313" fill="#d1fae5" font-size="10" text-anchor="middle">(Up from 56.9% CY24)</text>
  <text x="670" y="404" fill="#6ee7b7" font-size="12" font-weight="800" text-anchor="middle">4. Unit EBITDA</text>
  <text x="670" y="420" fill="#34d399" font-size="10.5" text-anchor="middle">(Operating Cash Profit)</text>

  <!-- Connector 4 -> 5 -->
  <line x1="730" y1="226" x2="785" y2="226" stroke="#94a3b8" stroke-dasharray="3,3"/>

  <!-- Step 5: Depr & Tax -> Unit PAT = ₹444 -->
  <rect x="785" y="226" width="55" height="38" rx="3" fill="#64748b"/>
  <text x="812" y="217" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">-₹148</text>
  <text x="812" y="249" fill="#f8fafc" font-size="9" text-anchor="middle">Tax/Dep</text>

  <rect x="850" y="264" width="115" height="116" rx="5" fill="#0ea5e9" stroke="#38bdf8" stroke-width="2"/>
  <text x="907" y="252" fill="#7dd3fc" font-size="14" font-weight="800" text-anchor="middle">₹444 (45.7%)</text>
  <text x="907" y="318" fill="#f0f9ff" font-size="11" font-weight="700" text-anchor="middle">46.7% in Q2'27</text>
  <text x="907" y="335" fill="#bae6fd" font-size="10" text-anchor="middle">(Pure Free Cash)</text>
  <text x="907" y="404" fill="#7dd3fc" font-size="12" font-weight="800" text-anchor="middle">5. Unit Net Profit</text>
  <text x="907" y="420" fill="#38bdf8" font-size="10.5" text-anchor="middle">(Net PAT per Report)</text>

  <!-- Footer Strip -->
  <rect x="36" y="436" width="978" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="525" y="455" fill="#e2e8f0" font-size="11.2" text-anchor="middle">
    <tspan fill="#fde047" font-weight="700">Operating Leverage Physics:</tspan> Once a lab is open and gemologists are salaried, grading the next diamond costs almost ₹0—generating &gt;75% incremental EBITDA margin!
  </text>
</svg>
