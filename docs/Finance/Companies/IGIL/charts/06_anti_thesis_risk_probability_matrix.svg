<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 530" width="100%" height="100%" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="redBub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.65"/>
    </radialGradient>
    <radialGradient id="amberBub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.65"/>
    </radialGradient>
    <radialGradient id="blueBub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.65"/>
    </radialGradient>
  </defs>

  <rect width="1050" height="530" rx="14" fill="url(#bgGrad6)" stroke="#334155" stroke-width="1.5"/>

  <text x="36" y="42" fill="#f8fafc" font-size="20" font-weight="700">IGIL Anti-Thesis Risk Matrix: 3–5 Year Probability vs. P&amp;L Profit (PAT) Impact</text>
  <text x="36" y="64" fill="#94a3b8" font-size="13">Plotting all 6 Anti-Thesis threats by Likelihood (X-Axis) vs. Severity of PAT Drop (Y-Axis), along with exact Quarterly Kill-Switch Thresholds.</text>

  <!-- Quadrant Backgrounds -->
  <rect x="100" y="100" width="430" height="170" fill="#ef4444" fill-opacity="0.05" stroke="#334155"/>
  <text x="115" y="122" fill="#fca5a5" font-size="11" font-weight="700">TAIL RISKS (Low Prob / Severe P&amp;L Impact)</text>

  <rect x="530" y="100" width="430" height="170" fill="#ef4444" fill-opacity="0.12" stroke="#334155"/>
  <text x="945" y="122" fill="#f87171" font-size="11" font-weight="700" text-anchor="end">CRITICAL ZONE (High Prob / High Impact)</text>

  <rect x="100" y="270" width="430" height="170" fill="#10b981" fill-opacity="0.04" stroke="#334155"/>
  <text x="115" y="432" fill="#6ee7b7" font-size="11" font-weight="700">MANAGEABLE NOISE (Low Prob / Moderate Impact)</text>

  <rect x="530" y="270" width="430" height="170" fill="#f59e0b" fill-opacity="0.07" stroke="#334155"/>
  <text x="945" y="432" fill="#fde047" font-size="11" font-weight="700" text-anchor="end">PRIMARY WATCH ZONE (High Prob / Valuation or Mid Impact)</text>

  <!-- Grid Lines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="3,3">
    <line x1="100" y1="383" x2="960" y2="383"/>
    <line x1="100" y1="327" x2="960" y2="327"/>
    <line x1="100" y1="213" x2="960" y2="213"/>
    <line x1="100" y1="157" x2="960" y2="157"/>
    <line x1="284" y1="100" x2="284" y2="440"/>
    <line x1="468" y1="100" x2="468" y2="440"/>
    <line x1="653" y1="100" x2="653" y2="440"/>
    <line x1="837" y1="100" x2="837" y2="440"/>
  </g>

  <!-- Y-Axis Labels (PAT Impact %) -->
  <text x="90" y="444" fill="#94a3b8" font-size="11" text-anchor="end">0% PAT Hit</text>
  <text x="90" y="387" fill="#94a3b8" font-size="11" text-anchor="end">-10% PAT</text>
  <text x="90" y="331" fill="#94a3b8" font-size="11" text-anchor="end">-20% PAT</text>
  <text x="90" y="274" fill="#94a3b8" font-size="11" text-anchor="end">-30% PAT</text>
  <text x="90" y="217" fill="#94a3b8" font-size="11" text-anchor="end">-40% PAT</text>
  <text x="90" y="161" fill="#94a3b8" font-size="11" text-anchor="end">-50% PAT</text>
  <text x="32" y="270" fill="#f87171" font-size="12" font-weight="700" transform="rotate(-90 32,270)" text-anchor="middle">Severity: P&amp;L Profit (PAT) Impact (%)</text>

  <!-- X-Axis Labels (3-5 Yr Probability %) -->
  <text x="100" y="460" fill="#94a3b8" font-size="11" text-anchor="middle">0%</text>
  <text x="284" y="460" fill="#94a3b8" font-size="11" text-anchor="middle">15%</text>
  <text x="468" y="460" fill="#94a3b8" font-size="11" text-anchor="middle">30%</text>
  <text x="653" y="460" fill="#94a3b8" font-size="11" text-anchor="middle">45%</text>
  <text x="837" y="460" fill="#94a3b8" font-size="11" text-anchor="middle">60%</text>
  <text x="530" y="482" fill="#fde047" font-size="12" font-weight="700" text-anchor="middle">Likelihood: 3–5 Year Probability of Playing Out (%)</text>

  <!-- Bubble 3: In-Factory Scandal -->
  <circle cx="180" cy="157" r="32" fill="url(#redBub)" stroke="#fca5a5" stroke-width="2"/>
  <text x="180" y="154" fill="#fff" font-size="11" font-weight="800" text-anchor="middle">#3 Scandal</text>
  <text x="180" y="168" fill="#fee2e2" font-size="9.5" text-anchor="middle">(-45% to -55%)</text>
  <rect x="222" y="135" width="215" height="44" rx="5" fill="#1e293b" stroke="#f87171"/>
  <text x="232" y="152" fill="#fca5a5" font-size="10.5" font-weight="700">#3 In-Factory Grading Scandal (5–8%)</text>
  <text x="232" y="168" fill="#cbd5e1" font-size="9.5">Kill-Switch: Top-10 Retailer Delisting / Probe</text>

  <!-- Bubble 2: GIA / GSI Price War -->
  <circle cx="345" cy="284" r="28" fill="url(#redBub)" stroke="#fca5a5" stroke-width="1.8"/>
  <text x="345" y="281" fill="#fff" font-size="10.5" font-weight="800" text-anchor="middle">#2 GIA War</text>
  <text x="345" y="295" fill="#fee2e2" font-size="9" text-anchor="middle">(-25% to -30%)</text>
  <rect x="130" y="262" width="178" height="44" rx="5" fill="#1e293b" stroke="#f87171"/>
  <text x="138" y="279" fill="#fca5a5" font-size="10.5" font-weight="700">#2 GIA Price War (15–20%)</text>
  <text x="138" y="295" fill="#cbd5e1" font-size="9.5">Kill: EBITDA Margin &lt; 55%</text>

  <!-- Bubble 6: US Tariffs & Surat Credit Freeze -->
  <circle cx="431" cy="355" r="26" fill="url(#amberBub)" stroke="#fde047" stroke-width="1.8"/>
  <text x="431" y="352" fill="#fff" font-size="10.5" font-weight="800" text-anchor="middle">#6 Tariffs</text>
  <text x="431" y="366" fill="#fef3c7" font-size="9" text-anchor="middle">(-12% to -18%)</text>
  <rect x="175" y="335" width="222" height="42" rx="5" fill="#1e293b" stroke="#f59e0b"/>
  <text x="183" y="351" fill="#fde047" font-size="10.5" font-weight="700">#6 US Tariffs / Surat Credit (25–30%)</text>
  <text x="183" y="366" fill="#cbd5e1" font-size="9.5">Kill: CFO/EBITDA &lt; 65% | Debtors &gt; 95d</text>

  <!-- Bubble 5: Retailer In-House AI Self-Cert -->
  <circle cx="500" cy="382" r="25" fill="url(#blueBub)" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="500" y="379" fill="#fff" font-size="10" font-weight="800" text-anchor="middle">#5 AI In-House</text>
  <text x="500" y="392" fill="#dbeafe" font-size="8.5" text-anchor="middle">(-10% to -18%)</text>
  <rect x="532" y="362" width="215" height="42" rx="5" fill="#1e293b" stroke="#60a5fa"/>
  <text x="540" y="378" fill="#93c5fd" font-size="10.5" font-weight="700">#5 Retailer Self-Cert (&lt;5% Near / 28% Long)</text>
  <text x="540" y="393" fill="#cbd5e1" font-size="9.5">Kill: Studded Jewelry Vol Growth &lt; 15%</text>

  <!-- Bubble 1: Loose LGD Commoditization Cliff -->
  <circle cx="690" cy="305" r="34" fill="url(#amberBub)" stroke="#fde047" stroke-width="2.5"/>
  <text x="690" y="301" fill="#fff" font-size="11" font-weight="800" text-anchor="middle">#1 Loose LGD</text>
  <text x="690" y="315" fill="#fef3c7" font-size="9.5" text-anchor="middle">(-18% to -22%)</text>
  <rect x="610" y="205" width="330" height="50" rx="6" fill="#1e293b" stroke="#fde047" stroke-width="1.5"/>
  <text x="620" y="223" fill="#fde047" font-size="11" font-weight="800">#1 Sub-1ct Loose LGD Fee Cliff (15% Near / 48% Long)</text>
  <text x="620" y="238" fill="#e2e8f0" font-size="9.5">Offset by +47% YoY Studded Jewelry &amp; AGL Colored Stones</text>
  <text x="620" y="250" fill="#fca5a5" font-size="9.5" font-weight="700">Kill-Switch: Blended ARP &lt; ₹830 for 2 Consecutive Quarters</text>
  <line x1="690" y1="255" x2="690" y2="271" stroke="#fde047" stroke-width="1.5"/>

  <!-- Bubble 4: Blackstone Supply Wall -->
  <circle cx="837" cy="390" r="28" fill="url(#blueBub)" stroke="#38bdf8" stroke-width="2"/>
  <text x="837" y="387" fill="#fff" font-size="10.5" font-weight="800" text-anchor="middle">#4 PE Supply</text>
  <text x="837" y="400" fill="#dbeafe" font-size="9" text-anchor="middle">(0% PAT Hit)</text>
  <rect x="755" y="284" width="195" height="62" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="765" y="302" fill="#7dd3fc" font-size="10.5" font-weight="800">#4 Blackstone 76.55% Overhang</text>
  <text x="765" y="317" fill="#e2e8f0" font-size="9.5">0% P&amp;L hit, but caps P/E at 20x–23x</text>
  <text x="765" y="330" fill="#e2e8f0" font-size="9.5">during block digestion (@ ₹450–₹500).</text>
  <text x="765" y="342" fill="#fca5a5" font-size="9.5" font-weight="700">Kill: Retail Float Spikes &gt; 18–20%</text>
  <line x1="837" y1="346" x2="837" y2="362" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Footer -->
  <rect x="36" y="494" width="978" height="26" rx="5" fill="#0f172a" stroke="#334155"/>
  <text x="525" y="511" fill="#cbd5e1" font-size="11" text-anchor="middle">
    <tspan fill="#6ee7b7" font-weight="700">Portfolio Defense Rule:</tspan> Zero high-probability risks sit in the top-right Critical Zone. Watch #4 (PE Block Absorption) in 2027 and #1 (Jewelry Mix &gt;50%) by 2029.
  </text>
</svg>
