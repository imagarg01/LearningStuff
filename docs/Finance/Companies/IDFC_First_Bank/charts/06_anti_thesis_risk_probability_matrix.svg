<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 560" width="100%" height="100%" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="redBub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.65"/>
    </radialGradient>
    <radialGradient id="amberBub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.65"/>
    </radialGradient>
    <radialGradient id="blueBub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.65"/>
    </radialGradient>
  </defs>

  <rect width="1050" height="560" rx="14" fill="url(#bgGrad6)" stroke="#334155" stroke-width="1.5"/>

  <text x="36" y="40" fill="#f8fafc" font-size="19.5" font-weight="700">IDFC First Bank Anti-Thesis Risk Matrix: Probabilities, ROA / P&amp;B Impact &amp; 6 Kill-Switches</text>
  <text x="36" y="62" fill="#94a3b8" font-size="12.5">Plotting all 6 Anti-Thesis threats by 3-Year Probability (X-Axis) vs. Severity of ROA &amp; P/B Multiple Impact (Y-Axis), with hard exit triggers.</text>

  <!-- Quadrant Backgrounds (X: 95 to 975, Y: 90 to 390) -->
  <rect x="95" y="90" width="440" height="150" fill="#ef4444" fill-opacity="0.06" stroke="#334155"/>
  <text x="110" y="110" fill="#fca5a5" font-size="10.5" font-weight="700">TAIL SHOCKS (Low Prob / Severe ROA &amp; Governance Hit)</text>

  <rect x="535" y="90" width="440" height="150" fill="#ef4444" fill-opacity="0.13" stroke="#334155"/>
  <text x="960" y="110" fill="#f87171" font-size="10.5" font-weight="700" text-anchor="end">CRITICAL DANGER ZONE (High Prob / Severe ROA Hit)</text>

  <rect x="95" y="240" width="440" height="150" fill="#10b981" fill-opacity="0.04" stroke="#334155"/>
  <text x="110" y="380" fill="#6ee7b7" font-size="10.5" font-weight="700">MANAGEABLE HEADWINDS (Low–Mod Prob / Modest Impact)</text>

  <rect x="535" y="240" width="440" height="150" fill="#f59e0b" fill-opacity="0.07" stroke="#334155"/>
  <text x="960" y="380" fill="#fde047" font-size="10.5" font-weight="700" text-anchor="end">PRIMARY WATCH ZONE (Mod–High Prob / Valuation Cap)</text>

  <!-- Grid Lines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="3,3">
    <line x1="95" y1="340" x2="975" y2="340"/>
    <line x1="95" y1="290" x2="975" y2="290"/>
    <line x1="95" y1="190" x2="975" y2="190"/>
    <line x1="95" y1="140" x2="975" y2="140"/>
    <line x1="271" y1="90" x2="271" y2="390"/>
    <line x1="447" y1="90" x2="447" y2="390"/>
    <line x1="623" y1="90" x2="623" y2="390"/>
    <line x1="799" y1="90" x2="799" y2="390"/>
  </g>

  <!-- Y-Axis Labels (ROA / PAT Severity) -->
  <text x="86" y="394" fill="#94a3b8" font-size="10" text-anchor="end">0 bps ROA</text>
  <text x="86" y="344" fill="#94a3b8" font-size="10" text-anchor="end">-15 bps</text>
  <text x="86" y="294" fill="#94a3b8" font-size="10" text-anchor="end">-30 bps</text>
  <text x="86" y="244" fill="#94a3b8" font-size="10" text-anchor="end">-45 bps</text>
  <text x="86" y="194" fill="#94a3b8" font-size="10" text-anchor="end">-60 bps</text>
  <text x="86" y="144" fill="#94a3b8" font-size="10" text-anchor="end">-75+ bps</text>
  <text x="26" y="240" fill="#f87171" font-size="11.5" font-weight="700" transform="rotate(-90 26,240)" text-anchor="middle">Severity: ROA Compression &amp; P/B De-Rating</text>

  <!-- X-Axis Labels (Probability %) -->
  <text x="95" y="408" fill="#94a3b8" font-size="10.5" text-anchor="middle">0%</text>
  <text x="271" y="408" fill="#94a3b8" font-size="10.5" text-anchor="middle">10%</text>
  <text x="447" y="408" fill="#94a3b8" font-size="10.5" text-anchor="middle">20%</text>
  <text x="623" y="408" fill="#94a3b8" font-size="10.5" text-anchor="middle">30%</text>
  <text x="799" y="408" fill="#94a3b8" font-size="10.5" text-anchor="middle">40%</text>
  <text x="975" y="408" fill="#94a3b8" font-size="10.5" text-anchor="middle">50%</text>
  <text x="535" y="426" fill="#fde047" font-size="11.5" font-weight="700" text-anchor="middle">Likelihood: 2–3 Year Probability of Materializing (%)</text>

  <!-- Risk #3: Repeat Branch Governance / Fraud Failure (Prob ~10%, Severity High: -45 bps one-time + P/B hit) -->
  <circle cx="265" cy="158" r="27" fill="url(#redBub)" stroke="#fca5a5" stroke-width="2"/>
  <text x="265" y="155" fill="#fff" font-size="10" font-weight="800" text-anchor="middle">#3 Fraud</text>
  <text x="265" y="168" fill="#fee2e2" font-size="8.5" text-anchor="middle">(-25% P/B)</text>
  <rect x="300" y="136" width="215" height="44" rx="5" fill="#1e293b" stroke="#f87171"/>
  <text x="308" y="152" fill="#fca5a5" font-size="10" font-weight="700">#3 Repeat Operational Fraud (8–12%)</text>
  <text x="308" y="167" fill="#cbd5e1" font-size="9">Kill: Any new fraud &gt;₹100 Cr or RBI penalty</text>

  <!-- Risk #2: Unsecured Retail / Card / MSME Contagion (Prob ~18%, Severity -40 bps ROA) -->
  <circle cx="412" cy="215" r="29" fill="url(#redBub)" stroke="#fca5a5" stroke-width="2"/>
  <text x="412" y="212" fill="#fff" font-size="10" font-weight="800" text-anchor="middle">#2 Credit</text>
  <text x="412" y="225" fill="#fee2e2" font-size="8.5" text-anchor="middle">(-40 bps ROA)</text>
  <rect x="135" y="195" width="238" height="42" rx="5" fill="#1e293b" stroke="#f87171"/>
  <text x="143" y="211" fill="#fca5a5" font-size="10" font-weight="700">#2 Retail / Card / MSME Contagion (15–20%)</text>
  <text x="143" y="225" fill="#cbd5e1" font-size="9">Kill: GNPA &gt; 2.0% or Credit Cost &gt; 1.85%</text>

  <!-- Risk #5: Serial Equity Dilution Below 1.5x Book (Prob ~15%, Severity -25 bps ROE) -->
  <circle cx="358" cy="305" r="25" fill="url(#blueBub)" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="358" y="302" fill="#fff" font-size="9.5" font-weight="800" text-anchor="middle">#5 Dilution</text>
  <text x="358" y="314" fill="#dbeafe" font-size="8.5" text-anchor="middle">(BVPS Drag)</text>
  <rect x="115" y="284" width="208" height="42" rx="5" fill="#1e293b" stroke="#60a5fa"/>
  <text x="123" y="300" fill="#93c5fd" font-size="10" font-weight="700">#5 Dilution &lt; 1.5x P/B (12–15%)</text>
  <text x="123" y="314" fill="#cbd5e1" font-size="9">Kill: Equity raise announced below ₹90/sh</text>

  <!-- Risk #1: Cost-to-Income Stickiness >68% (Prob ~28%, Severity -35 bps ROA) -->
  <circle cx="595" cy="255" r="32" fill="url(#amberBub)" stroke="#fde047" stroke-width="2.2"/>
  <text x="595" y="252" fill="#fff" font-size="10.5" font-weight="800" text-anchor="middle">#1 C/I &gt;68%</text>
  <text x="595" y="265" fill="#fef3c7" font-size="8.8" text-anchor="middle">(-35 bps ROA)</text>
  <rect x="550" y="155" width="255" height="46" rx="5" fill="#1e293b" stroke="#fde047" stroke-width="1.5"/>
  <text x="558" y="172" fill="#fde047" font-size="10.2" font-weight="800">#1 Cost-to-Income Stalls &gt;68% (25–30%)</text>
  <text x="558" y="186" fill="#e2e8f0" font-size="9">J-Curve slows if tech/branch opex stays elevated</text>
  <text x="558" y="197" fill="#fca5a5" font-size="9" font-weight="700">Kill: Core C/I &gt; 68% by Q4 FY27</text>
  <line x1="595" y1="201" x2="595" y2="223" stroke="#fde047" stroke-width="1.5"/>

  <!-- Risk #6: CASA Erosion / Deposit War (Prob ~25%, Severity -20 bps NIM) -->
  <circle cx="535" cy="325" r="26" fill="url(#amberBub)" stroke="#fde047" stroke-width="1.8"/>
  <text x="535" y="322" fill="#fff" font-size="9.5" font-weight="800" text-anchor="middle">#6 CASA War</text>
  <text x="535" y="334" fill="#fef3c7" font-size="8.5" text-anchor="middle">(-20 bps ROA)</text>
  <rect x="462" y="346" width="215" height="38" rx="5" fill="#1e293b" stroke="#f59e0b"/>
  <text x="470" y="361" fill="#fde047" font-size="9.8" font-weight="700">#6 CASA Deposit War (22–28%)</text>
  <text x="470" y="374" fill="#cbd5e1" font-size="8.8">Kill: Domestic CASA &lt; 42% for 2 qtrs</text>

  <!-- Risk #4: RBI Rate-Cut Cycle NIM Squeeze (Prob ~35%, Severity -22 bps ROA) -->
  <circle cx="715" cy="312" r="28" fill="url(#blueBub)" stroke="#38bdf8" stroke-width="2"/>
  <text x="715" y="309" fill="#fff" font-size="10" font-weight="800" text-anchor="middle">#4 Rate Cut</text>
  <text x="715" y="322" fill="#dbeafe" font-size="8.5" text-anchor="middle">(-22 bps NIM)</text>
  <rect x="752" y="282" width="212" height="52" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="760" y="298" fill="#7dd3fc" font-size="10" font-weight="800">#4 RBI Rate-Cut NIM Lead-Lag (35%)</text>
  <text x="760" y="312" fill="#e2e8f0" font-size="8.8">EBLR loans reprice before fixed TDs;</text>
  <text x="760" y="325" fill="#fca5a5" font-size="8.8" font-weight="700">Kill: NIM falls below 5.25% on AUM</text>

  <!-- Bottom Summary Table of 6 Kill-Switches -->
  <rect x="36" y="440" width="978" height="104" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="460" fill="#fde047" font-size="11.5" font-weight="800">Hard Quarterly Portfolio Kill-Switch Checklist (Exit or Trim Immediately If Any 2 Trigger):</text>

  <text x="52" y="480" fill="#e2e8f0" font-size="9.8"><tspan fill="#fde047" font-weight="700">1. Operating Leverage:</tspan> Core C/I stays &gt;68% beyond Q4 FY27</text>
  <text x="385" y="480" fill="#e2e8f0" font-size="9.8"><tspan fill="#fca5a5" font-weight="700">2. Asset Quality:</tspan> GNPA &gt;2.0% or Credit Cost &gt;1.85% of loans</text>
  <text x="715" y="480" fill="#e2e8f0" font-size="9.8"><tspan fill="#fca5a5" font-weight="700">3. Control / Audit:</tspan> Any branch fraud &gt;₹100 Cr or RBI curb</text>

  <text x="52" y="502" fill="#e2e8f0" font-size="9.8"><tspan fill="#7dd3fc" font-weight="700">4. Margin Defense:</tspan> NIM on AUM drops below 5.25%</text>
  <text x="385" y="502" fill="#e2e8f0" font-size="9.8"><tspan fill="#93c5fd" font-weight="700">5. Capital Discipline:</tspan> Equity dilution below 1.5x Book (&lt;₹90)</text>
  <text x="715" y="502" fill="#e2e8f0" font-size="9.8"><tspan fill="#fde047" font-weight="700">6. Liability Moat:</tspan> Domestic CASA drops below 42%</text>

  <text x="52" y="528" fill="#6ee7b7" font-size="10" font-weight="700">✓ Q2 FY27 Status Check: ALL 6 GREEN — Core C/I 70.16% (Incr 55%) | GNPA 1.32% | Cr. Cost ~1.38% | NIM ~5.65% | CET-1 ~14.2% | Dom. CASA ~50%</text>
</svg>
