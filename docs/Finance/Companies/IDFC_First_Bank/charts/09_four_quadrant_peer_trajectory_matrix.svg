<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" width="100%" height="100%" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="idfcNow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="idfcTarget" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="1"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="peerTier1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8"/>
    </radialGradient>
    <radialGradient id="peerPSU" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.8"/>
    </radialGradient>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1160" height="720" rx="14" fill="url(#bgGrad9)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="36" y="38" fill="#f8fafc" font-size="20" font-weight="800">Indian Banking 4-Quadrant Strategic Matrix &amp; IDFC FIRST Bank Trajectory (2018 &#8594; 2026 &#8594; 2029E)</text>
  <text x="36" y="60" fill="#94a3b8" font-size="12.5">Plotting Operating Efficiency &amp; ROA Engine (X-Axis: Cost-to-Income &amp; ROA) vs. Liability Moat &amp; Spread Power (Y-Axis: NIM &amp; CASA Franchise)</text>

  <!-- Legend Bar -->
  <circle cx="52" cy="82" r="7" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="65" y="86" fill="#cbd5e1" font-size="11.5" font-weight="600">IDFC Historical (2018–FY26)</text>

  <circle cx="255" cy="82" r="8" fill="url(#idfcNow)" stroke="#fef08a" stroke-width="2"/>
  <text x="270" y="86" fill="#fde047" font-size="11.5" font-weight="700">IDFC FIRST Today (H1 FY27 — Inflection)</text>

  <circle cx="535" cy="82" r="8" fill="url(#idfcTarget)" stroke="#a7f3d0" stroke-width="2"/>
  <text x="550" y="86" fill="#6ee7b7" font-size="11.5" font-weight="700">IDFC Target (FY28E–FY29E Guidance 2.0)</text>

  <circle cx="815" cy="82" r="7" fill="url(#peerTier1)" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="830" y="86" fill="#7dd3fc" font-size="11.5" font-weight="600">Private Sector Peers</text>

  <circle cx="975" cy="82" r="7" fill="url(#peerPSU)" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="990" y="86" fill="#d8b4fe" font-size="11.5" font-weight="600">Public Sector (PSU) Peers</text>

  <!-- Quadrant Plot Area: X from 95 to 1115 (Mid = 605), Y from 102 to 592 (Mid = 347) -->
  <!-- Q2: Top-Left (High Margin & CASA / High Upfront Opex Buildout) -->
  <rect x="95" y="102" width="510" height="245" fill="#f59e0b" fill-opacity="0.06" stroke="#475569" stroke-width="1.5"/>
  <text x="110" y="124" fill="#fde047" font-size="12.5" font-weight="800">QUADRANT II: THE COILED SPRING (FRANCHISE BUILDOUT)</text>
  <text x="110" y="140" fill="#cbd5e1" font-size="10.2">• High NIM (5.0%–6.3%) &amp; Strong CASA (47%–50%), High Revenue/Assets (&gt;7.2%)</text>
  <text x="110" y="154" fill="#cbd5e1" font-size="10.2">• Upfront Opex (C/I 68%–76% from young branches/cards) caps ROA at 0.5%–1.1%</text>
  <text x="110" y="168" fill="#fcd34d" font-size="10.2" font-weight="700">• Valuation Band: 1.1x – 1.45x P/B (Until Operating Leverage J-Curve Bends)</text>

  <!-- Q1: Top-Right (Elite Private Compounders) -->
  <rect x="605" y="102" width="510" height="245" fill="#10b981" fill-opacity="0.08" stroke="#475569" stroke-width="1.5"/>
  <text x="620" y="124" fill="#6ee7b7" font-size="12.5" font-weight="800">QUADRANT I: ELITE COMPOUNDER FORTRESS (SELF-FUNDING)</text>
  <text x="620" y="140" fill="#cbd5e1" font-size="10.2">• Strong Liability Moat (40%–52% CASA) + High Risk-Adjusted NIM (4.0%–5.8%)</text>
  <text x="620" y="154" fill="#cbd5e1" font-size="10.2">• Mature Operating Leverage (C/I 39%–58%) &#8594; 1.50%–2.30% ROA &amp; 15%–18%+ ROE</text>
  <text x="620" y="168" fill="#34d399" font-size="10.2" font-weight="700">• Valuation Band: 1.8x – 3.2x P/B (Zero Dilution Needed; Self-Sustaining Growth)</text>

  <!-- Q3: Bottom-Left (Wholesale DFI / Value Trap) -->
  <rect x="95" y="347" width="510" height="245" fill="#ef4444" fill-opacity="0.06" stroke="#475569" stroke-width="1.5"/>
  <text x="110" y="370" fill="#fca5a5" font-size="12.5" font-weight="800">QUADRANT III: WHOLESALE DFI / DILUTION TRAP ZONE</text>
  <text x="110" y="386" fill="#cbd5e1" font-size="10.2">• Weak Retail Liabilities (&lt;20% CASA) or Low Wholesale NIM (&lt;3.2%)</text>
  <text x="110" y="400" fill="#cbd5e1" font-size="10.2">• High C/I (&gt;70%) or Corporate Asset Quality Stress &#8594; ROA &lt; 0.7% &amp; ROE &lt; 8%</text>
  <text x="110" y="414" fill="#f87171" font-size="10.2" font-weight="700">• Valuation Band: 0.5x – 1.0x P/B (Destroys Value Below Cost of Equity)</text>

  <!-- Q4: Bottom-Right (PSU Giants & Regional Cyclical Value) -->
  <rect x="605" y="347" width="510" height="245" fill="#a855f7" fill-opacity="0.06" stroke="#475569" stroke-width="1.5"/>
  <text x="620" y="370" fill="#d8b4fe" font-size="12.5" font-weight="800">QUADRANT IV: PSU GIANTS &amp; LOW-NIM SCALE VALUE ZONE</text>
  <text x="620" y="386" fill="#cbd5e1" font-size="10.2">• Thinner NIM (2.9%–3.3%) due to PSU/Corporate pricing &amp; lower yield mix</text>
  <text x="620" y="400" fill="#cbd5e1" font-size="10.2">• Lean Opex (48%–54% C/I) + High Leverage (13x–16x) &#8594; 1.0%–1.2% ROA, 14%–18% ROE</text>
  <text x="620" y="414" fill="#c084fc" font-size="10.2" font-weight="700">• Valuation Band: 1.0x – 1.5x P/B (Cyclical Re-Rating Completed in FY22–FY26)</text>

  <!-- Center Dividing Threshold Lines -->
  <line x1="605" y1="102" x2="605" y2="592" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="95" y1="347" x2="1115" y2="347" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>

  <rect x="500" y="568" width="210" height="20" rx="4" fill="#0f172a" stroke="#64748b"/>
  <text x="605" y="582" fill="#e2e8f0" font-size="9.8" font-weight="700" text-anchor="middle">65% C/I &amp; 1.20% ROA Threshold</text>

  <rect x="395" y="337" width="195" height="20" rx="4" fill="#0f172a" stroke="#64748b"/>
  <text x="492" y="351" fill="#e2e8f0" font-size="9.8" font-weight="700" text-anchor="middle">3.8% NIM &amp; 40% CASA Threshold</text>

  <!-- Axes Labels -->
  <text x="605" y="615" fill="#f8fafc" font-size="12.5" font-weight="700" text-anchor="middle">X-Axis: Operating Efficiency (Cost-to-Income: 82% &#8594; 39%) &amp; Return on Assets (ROA: -1.2% &#8594; +2.3%) &#8594;</text>
  <text x="28" y="347" fill="#f8fafc" font-size="12.5" font-weight="700" transform="rotate(-90 28,347)" text-anchor="middle">Y-Axis: Liability Moat (CASA %) &amp; Spread Power (NIM: 2.5% &#8594; 6.4%) &#8594;</text>

  <!-- ================= IDFC FIRST BANK HISTORICAL TRAJECTORY (6 NODES, NO OVERLAPS) ================= -->

  <!-- Trajectory Arrows Drawn First Underneath Nodes -->
  <!-- 1 (155, 520) -> 2 (165, 250) -->
  <path d="M 155 506 L 164 265" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrowGold)"/>
  <!-- 2 (165, 250) -> 3 (435, 198) -->
  <path d="M 178 247 L 420 201" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrowGold)"/>
  <!-- 3 (435, 198) -> 4 (335, 275) -->
  <path d="M 424 206 L 348 266" fill="none" stroke="#f87171" stroke-width="2.3" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>
  <!-- 4 (335, 275) -> NOW (575, 232) -->
  <path d="M 349 273 L 555 236" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrowGold)"/>
  <!-- NOW (575, 232) -> FY29E (745, 212) -->
  <path d="M 592 230 L 726 214" fill="none" stroke="#34d399" stroke-width="3.5" stroke-dasharray="6,3" marker-end="url(#arrowGreen)"/>

  <!-- Node 1: Dec 2018 Merger (Q3: 155, 520) -->
  <circle cx="155" cy="520" r="11" fill="#ef4444" stroke="#fca5a5" stroke-width="2"/>
  <text x="155" y="524" fill="#fff" font-size="10" font-weight="800" text-anchor="middle">1</text>
  <rect x="176" y="495" width="255" height="46" rx="5" fill="#1e293b" stroke="#ef4444"/>
  <text x="185" y="511" fill="#fca5a5" font-size="10.5" font-weight="800">1. Dec 2018 (Merger Baseline)</text>
  <text x="185" y="525" fill="#cbd5e1" font-size="9.5">8.7% CASA | 2.9% NIM | 81.5% C/I | -1.2% ROA</text>
  <text x="185" y="537" fill="#94a3b8" font-size="8.8">Wholesale DFI burdened with 8.8% infra bonds</text>

  <!-- Node 2: FY21-FY22 (Q2 Left: 165, 250) -->
  <circle cx="165" cy="250" r="11" fill="#f97316" stroke="#fdba74" stroke-width="2"/>
  <text x="165" y="254" fill="#fff" font-size="10" font-weight="800" text-anchor="middle">2</text>
  <rect x="108" y="182" width="196" height="36" rx="5" fill="#1e293b" stroke="#f97316"/>
  <text x="116" y="197" fill="#fdba74" font-size="10" font-weight="800">2. FY21–FY22 (CASA Surge)</text>
  <text x="116" y="211" fill="#cbd5e1" font-size="9">50% CASA | 5.8% NIM | 76% C/I</text>
  <line x1="165" y1="218" x2="165" y2="238" stroke="#f97316" stroke-width="1.5"/>

  <!-- Node 3: FY24 Peak (435, 198) -->
  <circle cx="435" cy="198" r="11" fill="#fbbf24" stroke="#fef08a" stroke-width="2"/>
  <text x="435" y="202" fill="#0f172a" font-size="10" font-weight="800" text-anchor="middle">3</text>
  <rect x="318" y="178" width="102" height="36" rx="5" fill="#1e293b" stroke="#fbbf24"/>
  <text x="325" y="193" fill="#fde047" font-size="9.5" font-weight="800">3. FY24 Peak</text>
  <text x="325" y="207" fill="#cbd5e1" font-size="8.8">6.36% NIM | 1.1% ROA</text>

  <!-- Node 4: FY25-FY26 MFI & Fraud Setback (335, 275) -->
  <circle cx="335" cy="275" r="11" fill="#ef4444" stroke="#fca5a5" stroke-width="2"/>
  <text x="335" y="279" fill="#fff" font-size="10" font-weight="800" text-anchor="middle">4</text>
  <rect x="195" y="292" width="212" height="36" rx="5" fill="#1e293b" stroke="#f87171"/>
  <text x="203" y="307" fill="#fca5a5" font-size="9.8" font-weight="800">4. FY25–FY26 (MFI + Fraud Dip)</text>
  <text x="203" y="320" fill="#cbd5e1" font-size="8.8">ROA dipped to 0.44%–0.48% | P/B hit 1.1x</text>

  <!-- Node 5: TODAY — H1 FY27 (On the Q2 -> Q1 Border: 575, 232) -->
  <circle cx="575" cy="232" r="16" fill="url(#idfcNow)" stroke="#fef08a" stroke-width="3"/>
  <text x="575" y="236" fill="#0f172a" font-size="10" font-weight="900" text-anchor="middle">NOW</text>
  <rect x="432" y="268" width="166" height="52" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <text x="440" y="284" fill="#fde047" font-size="10.2" font-weight="800">5. H1 FY27 (TODAY)</text>
  <text x="440" y="298" fill="#f8fafc" font-size="9">₹2,120 Cr H1 PAT | 70.16% C/I</text>
  <text x="440" y="311" fill="#34d399" font-size="9" font-weight="700">55% Incr. C/I | 1.32x P/B</text>
  <line x1="550" y1="268" x2="567" y2="246" stroke="#fbbf24" stroke-width="1.8"/>

  <!-- Node 6: FY28E–FY29E Guidance 2.0 Target (Inside Q1: 745, 212) -->
  <circle cx="745" cy="212" r="15" fill="url(#idfcTarget)" stroke="#a7f3d0" stroke-width="2.5"/>
  <text x="745" y="216" fill="#0f172a" font-size="9.5" font-weight="900" text-anchor="middle">FY29E</text>
  <rect x="618" y="176" width="110" height="36" rx="5" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="625" y="191" fill="#6ee7b7" font-size="9.5" font-weight="800">6. FY28E–FY29E</text>
  <text x="625" y="205" fill="#ecfdf5" font-size="8.8">1.3%&#8594;1.7% ROA</text>

  <!-- ================= PEER POSITIONS IN QUADRANT I (PRIVATE SECTOR) ================= -->
  <!-- Kotak Mahindra Bank (935, 198) -->
  <circle cx="935" cy="198" r="11" fill="url(#peerTier1)" stroke="#e0f2fe" stroke-width="2"/>
  <text x="935" y="181" fill="#7dd3fc" font-size="10.5" font-weight="800" text-anchor="middle">Kotak Mahindra Bank</text>
  <text x="935" y="221" fill="#cbd5e1" font-size="9" text-anchor="middle">2.1% ROA | 4.9% NIM | 2.3x P/B</text>

  <!-- ICICI Bank (1025, 252) -->
  <circle cx="1025" cy="252" r="12.5" fill="url(#peerTier1)" stroke="#e0f2fe" stroke-width="2"/>
  <text x="1025" y="233" fill="#7dd3fc" font-size="11" font-weight="800" text-anchor="middle">ICICI Bank</text>
  <text x="1025" y="275" fill="#cbd5e1" font-size="9" text-anchor="middle">2.25% ROA | 40% C/I | 2.9x P/B</text>

  <!-- AU Small Finance Bank (705, 260) -->
  <circle cx="705" cy="260" r="9.5" fill="url(#peerTier1)" stroke="#e0f2fe" stroke-width="1.5"/>
  <text x="705" y="281" fill="#7dd3fc" font-size="9.2" font-weight="700" text-anchor="middle">AU SFB (1.55% ROA | 58% C/I | 2.2x P/B)</text>

  <!-- Axis Bank (835, 292) -->
  <circle cx="835" cy="292" r="10.5" fill="url(#peerTier1)" stroke="#e0f2fe" stroke-width="1.8"/>
  <text x="835" y="275" fill="#7dd3fc" font-size="10.5" font-weight="800" text-anchor="middle">Axis Bank</text>
  <text x="835" y="312" fill="#cbd5e1" font-size="9" text-anchor="middle">1.75% ROA | 48% C/I | 1.8x P/B</text>

  <!-- HDFC Bank (985, 308) -->
  <circle cx="985" cy="308" r="12" fill="url(#peerTier1)" stroke="#e0f2fe" stroke-width="2"/>
  <text x="985" y="330" fill="#7dd3fc" font-size="10.5" font-weight="800" text-anchor="middle">HDFC Bank (1.9% ROA | 40% C/I | 2.4x P/B)</text>

  <!-- IndusInd Bank (655, 308) -->
  <circle cx="655" cy="308" r="9.5" fill="url(#peerTier1)" stroke="#e0f2fe" stroke-width="1.5"/>
  <text x="680" y="330" fill="#93c5fd" font-size="9.2" font-weight="700" text-anchor="middle">IndusInd (1.25% ROA | 1.3x P/B)</text>

  <!-- ================= PEER POSITIONS IN QUADRANT IV (PSU & REGIONAL VALUE) ================= -->
  <!-- SBI (835, 445) -->
  <circle cx="835" cy="445" r="13" fill="url(#peerPSU)" stroke="#f3e8ff" stroke-width="2"/>
  <text x="835" y="426" fill="#e9d5ff" font-size="11" font-weight="800" text-anchor="middle">State Bank of India (SBI)</text>
  <text x="835" y="468" fill="#cbd5e1" font-size="9.2" text-anchor="middle">1.08% ROA | 3.15% NIM | 51% C/I | 17% ROE | 1.4x P/B</text>

  <!-- Bank of Baroda (975, 498) -->
  <circle cx="975" cy="498" r="11" fill="url(#peerPSU)" stroke="#f3e8ff" stroke-width="1.8"/>
  <text x="975" y="520" fill="#d8b4fe" font-size="9.5" font-weight="700" text-anchor="middle">Bank of Baroda (1.10% ROA | 3.1% NIM | 1.1x P/B)</text>

  <!-- Federal Bank (705, 498) -->
  <circle cx="705" cy="498" r="10" fill="url(#peerTier1)" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="705" y="520" fill="#7dd3fc" font-size="9.5" font-weight="700" text-anchor="middle">Federal Bank (1.22% ROA | 3.15% NIM | 1.4x P/B)</text>

  <!-- PNB & Canara Bank (840, 542) -->
  <circle cx="840" cy="542" r="10" fill="url(#peerPSU)" stroke="#f3e8ff" stroke-width="1.8"/>
  <text x="840" y="562" fill="#d8b4fe" font-size="9.5" font-weight="700" text-anchor="middle">Canara Bank / PNB (0.95%–1.05% ROA | 2.9% NIM | 1.0x–1.2x P/B)</text>

  <!-- Footer Summary Box -->
  <rect x="36" y="634" width="1088" height="68" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="52" y="656" fill="#38bdf8" font-size="12" font-weight="800">STRATEGIC TAKEAWAY — WHY THE Q2 &#8594; Q1 CROSSING IS THE HIGHEST-ALPHA PLAY IN INDIAN BANKING:</text>
  <text x="52" y="674" fill="#e2e8f0" font-size="11">1. PSU Banks (Q4: SBI, BoB, PNB) already re-rated from 0.5x to 1.1x–1.4x P/B as credit costs normalized, but their ~3.0% NIM caps ROA at ~1.1%.</text>
  <text x="52" y="691" fill="#e2e8f0" font-size="11">2. IDFC FIRST (at the Q2 &#8594; Q1 border) already has Q1-caliber NIM (5.6%–6.0%) &amp; CASA (~50%); compressing C/I from 70% to 58% propels it into Q1 (1.6x–2.0x P/B).</text>
</svg>
