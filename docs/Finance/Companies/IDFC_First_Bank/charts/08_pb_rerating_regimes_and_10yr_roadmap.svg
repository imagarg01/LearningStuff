<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 530" width="100%" height="100%" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrowG8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1050" height="530" rx="14" fill="url(#bgGrad8)" stroke="#334155" stroke-width="1.5"/>

  <text x="36" y="40" fill="#f8fafc" font-size="19.5" font-weight="700">Price-to-Book (P/B) Re-Rating Regimes (2027–28) &amp; 10-Year Compounding Roadmap (2026 &#8594; 2036)</text>
  <text x="36" y="62" fill="#94a3b8" font-size="12.5">Mapping the 3 P/B valuation regimes off FY27E BVPS (₹61.50) &amp; FY28E BVPS (₹69.50) and the 10-year twin-engine compounding trajectory.</text>

  <!-- TOP HALF: 3 P/B Re-Rating Regimes (2027-2028) -->
  <text x="40" y="92" fill="#e2e8f0" font-size="13.5" font-weight="700">Part A: Probability-Weighted P/B Re-Rating Regimes (2027 – 2028)</text>

  <!-- Current Box (Left) -->
  <rect x="40" y="128" width="215" height="114" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="147" y="150" fill="#7dd3fc" font-size="12" font-weight="800" text-anchor="middle">TODAY (CMP ~₹76 / Share)</text>
  <text x="147" y="169" fill="#f8fafc" font-size="10.5" font-weight="600" text-anchor="middle">• Q2 FY27 BVPS: ~₹57.50</text>
  <text x="147" y="186" fill="#6ee7b7" font-size="10.5" font-weight="700" text-anchor="middle">• ~1.32x Trailing P/B</text>
  <text x="147" y="203" fill="#fde047" font-size="10.5" font-weight="700" text-anchor="middle">• 1.24x FY27E BVPS (₹61.50)</text>
  <text x="147" y="220" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">• 1.09x FY28E BVPS (₹69.50)</text>
  <text x="147" y="235" fill="#94a3b8" font-size="9" text-anchor="middle">(H1 FY27 ROA: 0.99% | PAT ₹2,120 Cr)</text>

  <!-- Connectors from Today to 3 Regimes -->
  <path d="M 255,160 L 320,132" fill="none" stroke="#10b981" stroke-width="2.5"/>
  <path d="M 255,185 L 320,204" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <path d="M 255,210 L 320,276" fill="none" stroke="#f59e0b" stroke-width="2"/>

  <!-- Regime 1: Base Re-Rating (65% Prob) -->
  <rect x="325" y="102" width="685" height="62" rx="7" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="342" y="122" fill="#6ee7b7" font-size="12" font-weight="800">1. Base-Case Re-Rating — 65% Probability (Primary Institutional Path)</text>
  <text x="342" y="138" fill="#ecfdf5" font-size="10">• <tspan fill="#fde047" font-weight="700">1.50x – 1.75x FY28E P/B (off ₹69.50 BVPS):</tspan> Driven by ROA expanding from</text>
  <text x="342" y="152" fill="#ecfdf5" font-size="10">  0.99% &#8594; 1.25%–1.35%, Core C/I dropping below 67%, and ROE reaching 12%–13.5%.</text>
  <rect x="832" y="111" width="164" height="44" rx="5" fill="#047857" stroke="#34d399"/>
  <text x="914" y="130" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">₹105 – ₹122</text>
  <text x="914" y="146" fill="#a7f3d0" font-size="9.5" font-weight="600" text-anchor="middle">(+38% to +60% vs ₹76)</text>

  <!-- Regime 2: Bull Re-Rating (20-25% Prob) -->
  <rect x="325" y="174" width="685" height="62" rx="7" fill="#1e293b" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="342" y="194" fill="#93c5fd" font-size="12" font-weight="800">2. Bull-Case Re-Rating ("ICICI Bank J-Curve Multiple") — 20% to 25% Probability</text>
  <text x="342" y="210" fill="#cbd5e1" font-size="10">• <tspan fill="#7dd3fc" font-weight="700">1.90x – 2.20x FY28E P/B:</tspan> Triggered if ROA crosses 1.50%+, Core C/I compresses</text>
  <text x="342" y="224" fill="#cbd5e1" font-size="10">  below 64%, and ROE crosses 15%—pricing IDFC First as India's next private bank giant.</text>
  <rect x="832" y="183" width="164" height="44" rx="5" fill="#1d4ed8" stroke="#60a5fa"/>
  <text x="914" y="202" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">₹135 – ₹155</text>
  <text x="914" y="218" fill="#dbeafe" font-size="9.5" font-weight="600" text-anchor="middle">(+78% to +104% vs ₹76)</text>

  <!-- Regime 3: Capped Multiple (10-15% Prob) -->
  <rect x="325" y="246" width="685" height="62" rx="7" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="342" y="266" fill="#fde047" font-size="12" font-weight="800">3. Capped P/B Regime (Slow Opex Compression) — 10% to 15% Probability</text>
  <text x="342" y="282" fill="#cbd5e1" font-size="10">• <tspan fill="#fde68a" font-weight="700">1.15x – 1.30x FY28E P/B:</tspan> Even with zero multiple expansion, <tspan fill="#6ee7b7" font-weight="700">11%–13% annual</tspan></text>
  <text x="342" y="296" fill="#cbd5e1" font-size="10">  <tspan fill="#6ee7b7" font-weight="700">BVPS compounding (₹57.5 &#8594; ₹69.5) protects downside at ₹80–₹90!</tspan></text>
  <rect x="832" y="255" width="164" height="44" rx="5" fill="#78350f" stroke="#f59e0b"/>
  <text x="914" y="274" fill="#fef3c7" font-size="13" font-weight="800" text-anchor="middle">₹80 – ₹90</text>
  <text x="914" y="290" fill="#fde68a" font-size="9.5" font-weight="600" text-anchor="middle">(Protected by Book Growth)</text>

  <!-- Divider -->
  <line x1="40" y1="324" x2="1010" y2="324" stroke="#334155" stroke-width="1.5"/>

  <!-- BOTTOM HALF: 10-Year Compounding Scenarios (2026 -> 2036) -->
  <text x="40" y="348" fill="#e2e8f0" font-size="13.5" font-weight="700">Part B: 10-Year Wealth Compounding Roadmap (2026 &#8594; 2036 Across Bear, Base &amp; Bull Regimes)</text>

  <!-- Bear Case Box -->
  <rect x="40" y="364" width="295" height="142" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="56" y="388" fill="#fde047" font-size="12.5" font-weight="800">1. 2036 BEAR CASE (Commoditized)</text>
  <text x="56" y="408" fill="#ffffff" font-size="14" font-weight="800">2036 Target: ~₹165 / Share</text>
  <text x="56" y="427" fill="#cbd5e1" font-size="10.2">• <tspan fill="#fde68a" font-weight="700">BVPS CAGR: 10.0%/yr</tspan> (₹57.5 &#8594; ~₹150)</text>
  <text x="56" y="443" fill="#cbd5e1" font-size="10.2">• ROA plateaus at ~1.0% | ROE ~10%–11%</text>
  <text x="56" y="459" fill="#cbd5e1" font-size="10.2">• <tspan fill="#fde68a" font-weight="700">Exit P/B Multiple: 1.10x</tspan> (No re-rating)</text>
  <rect x="56" y="470" width="263" height="24" rx="4" fill="#78350f"/>
  <text x="187" y="486" fill="#fef3c7" font-size="10.2" font-weight="700" text-anchor="middle">~2.2x Wealth Multiplier (~8% CAGR)</text>

  <line x1="335" y1="435" x2="372" y2="435" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowG8)"/>

  <!-- Base Case Box -->
  <rect x="378" y="364" width="295" height="142" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="394" y="388" fill="#6ee7b7" font-size="12.5" font-weight="800">2. 2036 BASE CASE (Institutional Core)</text>
  <text x="394" y="408" fill="#ffffff" font-size="14" font-weight="800">2036 Target: ₹395 – ₹420 / Sh</text>
  <text x="394" y="427" fill="#ecfdf5" font-size="10.2">• <tspan fill="#fde047" font-weight="700">BVPS CAGR: 14.5%/yr</tspan> (₹57.5 &#8594; ~₹220)</text>
  <text x="394" y="443" fill="#ecfdf5" font-size="10.2">• Steady ROA 1.50%–1.65% | ROE 15%–16%</text>
  <text x="394" y="459" fill="#ecfdf5" font-size="10.2">• <tspan fill="#fde047" font-weight="700">Exit P/B Multiple: 1.80x – 1.90x</tspan></text>
  <rect x="394" y="470" width="263" height="24" rx="4" fill="#047857" stroke="#34d399"/>
  <text x="525" y="486" fill="#ffffff" font-size="10.2" font-weight="800" text-anchor="middle">~5.3x – 5.6x Multiplier (~18.3% CAGR)</text>

  <line x1="673" y1="435" x2="710" y2="435" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowG8)"/>

  <!-- Bull Case Box -->
  <rect x="716" y="364" width="294" height="142" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="732" y="388" fill="#7dd3fc" font-size="12.5" font-weight="800">3. 2036 BULL CASE ("Next ICICI/Kotak")</text>
  <text x="732" y="408" fill="#ffffff" font-size="14" font-weight="800">2036 Target: ₹630+ / Share</text>
  <text x="732" y="427" fill="#e2e8f0" font-size="10.2">• <tspan fill="#fde047" font-weight="700">BVPS CAGR: 17.0%/yr</tspan> (₹57.5 &#8594; ~₹275)</text>
  <text x="732" y="443" fill="#e2e8f0" font-size="10.2">• ROA 1.80%+ | C/I &lt;55% | ROE 17%–18.5%</text>
  <text x="732" y="459" fill="#e2e8f0" font-size="10.2">• <tspan fill="#fde047" font-weight="700">Exit P/B Multiple: 2.30x</tspan> + Dividends</text>
  <rect x="732" y="470" width="262" height="24" rx="4" fill="#1d4ed8" stroke="#60a5fa"/>
  <text x="863" y="486" fill="#ffffff" font-size="10.2" font-weight="800" text-anchor="middle">~8.3x Wealth Multiplier (~23.6% CAGR)</text>
</svg>
