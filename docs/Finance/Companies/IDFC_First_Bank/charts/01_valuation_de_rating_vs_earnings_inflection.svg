<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 580" width="100%" height="100%" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="patBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="troughBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="targetZone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.32"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1050" height="580" rx="14" fill="url(#bgGrad1)" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="42" fill="#f8fafc" font-size="19.5" font-weight="700">IDFC First Bank Valuation Arc: MFI Cycle De-Rating (2.1x &#8594; 1.1x P/B) vs. H1 FY27 PAT Inflection &amp; Stage 2 Breakout</text>
  <text x="36" y="65" fill="#94a3b8" font-size="12.8">After absorbing the FY25–26 MFI crisis and Q4 FY26 Chandigarh fraud, H1 FY27 PAT hit a record ₹2,120 Cr (~₹4,240 Cr run-rate), igniting a Stage 2 re-rating.</text>

  <!-- Legend -->
  <rect x="36" y="80" width="14" height="14" rx="3" fill="url(#patBar)" stroke="#10b981"/>
  <text x="56" y="92" fill="#cbd5e1" font-size="12" font-weight="600">Annual / Run-Rate PAT (₹ Cr)</text>
  <line x1="255" y1="87" x2="285" y2="87" stroke="#f59e0b" stroke-width="3.5"/>
  <circle cx="270" cy="87" r="5" fill="#f59e0b"/>
  <text x="293" y="92" fill="#cbd5e1" font-size="12" font-weight="600">Stock Price Trajectory (₹/Share) &amp; P/B Multiple</text>
  <line x1="595" y1="87" x2="625" y2="87" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="633" y="92" fill="#38bdf8" font-size="12" font-weight="600">200-Day Moving Average &amp; ₹60 PE Anchor Floor</text>

  <!-- Stage Background Zones -->
  <!-- Stage 3 Zone -->
  <rect x="90" y="115" width="145" height="365" fill="#ef4444" fill-opacity="0.07" stroke="#ef4444" stroke-opacity="0.25" stroke-dasharray="4,4"/>
  <text x="162" y="135" fill="#fca5a5" font-size="11" font-weight="700" text-anchor="middle">STAGE 3: CYCLE PEAK</text>
  <text x="162" y="150" fill="#f87171" font-size="10" text-anchor="middle">(₹95–₹100 | ~2.1x P/B)</text>

  <!-- Stage 4 Zone -->
  <rect x="235" y="115" width="155" height="365" fill="#f97316" fill-opacity="0.06" stroke="#f97316" stroke-opacity="0.25" stroke-dasharray="4,4"/>
  <text x="312" y="135" fill="#fdba74" font-size="11" font-weight="700" text-anchor="middle">STAGE 4: MFI DE-RATING</text>
  <text x="312" y="150" fill="#fb923c" font-size="10" text-anchor="middle">(ROA 0.48% | Cr. Cost 2.46%)</text>

  <!-- Stage 1 Base Zone -->
  <rect x="390" y="115" width="165" height="365" fill="#eab308" fill-opacity="0.07" stroke="#eab308" stroke-opacity="0.3" stroke-dasharray="4,4"/>
  <text x="472" y="135" fill="#fde047" font-size="11" font-weight="700" text-anchor="middle">STAGE 1: INSTITUTIONAL BASE</text>
  <text x="472" y="150" fill="#facc15" font-size="10" text-anchor="middle">(₹60 Warburg+ADIA Floor | 1.1x P/B)</text>

  <!-- Stage 2 Breakout Zone -->
  <rect x="555" y="115" width="415" height="365" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-dasharray="4,4"/>
  <text x="762" y="135" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">STAGE 2: EARNINGS INFLECTION &amp; P/B RE-RATING</text>
  <text x="762" y="150" fill="#34d399" font-size="10" text-anchor="middle">(H1 FY27 PAT ₹2,120 Cr | GNPA 1.32% &#8594; ₹76 CMP &#8594; ₹105–₹125 Target)</text>

  <!-- Grid Lines (Left Y-axis Price: ₹40 at Y=480 to ₹140 at Y=160 -> 3.2px per Rs) -->
  <!-- Right Y-axis PAT: ₹0 Cr at Y=480 to ₹6,400 Cr at Y=160 -> 0.05px per Cr (₹1,600 Cr per 80px step) -->
  <g stroke="#334155" stroke-width="1">
    <line x1="90" y1="480" x2="970" y2="480"/>
    <line x1="90" y1="400" x2="970" y2="400" stroke-dasharray="3,3"/>
    <line x1="90" y1="320" x2="970" y2="320" stroke-dasharray="3,3"/>
    <line x1="90" y1="240" x2="970" y2="240" stroke-dasharray="3,3"/>
    <line x1="90" y1="160" x2="970" y2="160" stroke-dasharray="3,3"/>
  </g>

  <!-- Left Y-Axis Labels (Stock Price) -->
  <text x="80" y="484" fill="#94a3b8" font-size="11" text-anchor="end">₹40</text>
  <text x="80" y="404" fill="#94a3b8" font-size="11" text-anchor="end">₹65</text>
  <text x="80" y="324" fill="#94a3b8" font-size="11" text-anchor="end">₹90</text>
  <text x="80" y="244" fill="#94a3b8" font-size="11" text-anchor="end">₹115</text>
  <text x="80" y="164" fill="#94a3b8" font-size="11" text-anchor="end">₹140</text>
  <text x="28" y="320" fill="#f59e0b" font-size="12" font-weight="700" transform="rotate(-90 28,320)" text-anchor="middle">Stock Price (₹ / Share)</text>

  <!-- Right Y-Axis Labels (PAT in Cr: 0 to 6,400) -->
  <text x="980" y="484" fill="#6ee7b7" font-size="11">₹0 Cr</text>
  <text x="980" y="404" fill="#6ee7b7" font-size="11">₹1,600 Cr</text>
  <text x="980" y="324" fill="#6ee7b7" font-size="11">₹3,200 Cr</text>
  <text x="980" y="244" fill="#6ee7b7" font-size="11">₹4,800 Cr</text>
  <text x="980" y="164" fill="#6ee7b7" font-size="11">₹6,400 Cr</text>
  <text x="1038" y="320" fill="#10b981" font-size="12" font-weight="700" transform="rotate(90 1038,320)" text-anchor="middle">Annual / Run-Rate PAT (₹ Crore)</text>

  <!-- Warburg Pincus & ADIA ₹60 Floor Line (Rs 60 -> Y = 416) -->
  <line x1="90" y1="416" x2="970" y2="416" stroke="#38bdf8" stroke-width="1.3" stroke-dasharray="8,4" stroke-opacity="0.65"/>
  <rect x="242" y="420" width="248" height="18" rx="3" fill="#0f172a" fill-opacity="0.92"/>
  <text x="248" y="433" fill="#38bdf8" font-size="9.5" font-weight="700">Warburg Pincus + ADIA ₹7,500 Cr Floor: ₹60/sh</text>

  <!-- PAT Bars (7 time points: X = 155, 310, 465, 605, 715, 815, 915) -->
  <!-- 1. FY24 PAT: ₹2,957 Cr -> H=148, Y=332 -->
  <rect x="125" y="332" width="60" height="148" rx="4" fill="url(#patBar)" stroke="#10b981" stroke-width="1.2"/>
  <text x="155" y="352" fill="#ecfdf5" font-size="10.5" font-weight="700" text-anchor="middle">₹2,957 Cr</text>
  <text x="155" y="366" fill="#a7f3d0" font-size="9" text-anchor="middle">FY24 (ROA 1.1%)</text>

  <!-- 2. FY25 PAT: ₹1,525 Cr -> H=76, Y=404 -->
  <rect x="280" y="404" width="60" height="76" rx="4" fill="url(#troughBar)" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="310" y="424" fill="#fef3c7" font-size="10.5" font-weight="700" text-anchor="middle">₹1,525 Cr</text>
  <text x="310" y="438" fill="#fde68a" font-size="9" text-anchor="middle">FY25 (MFI Hit)</text>

  <!-- 3. FY26 PAT: ₹1,636 Cr Rep / ₹2,119 Cr Norm -> H=82 (Rep) + 24 (Norm)=106, Y=374 -->
  <rect x="435" y="374" width="60" height="24" rx="2" fill="#eab308" fill-opacity="0.25" stroke="#eab308" stroke-dasharray="3,2"/>
  <rect x="435" y="398" width="60" height="82" rx="4" fill="url(#troughBar)" stroke="#eab308" stroke-width="1.2"/>
  <text x="465" y="367" fill="#fde047" font-size="9.5" font-weight="700" text-anchor="middle">₹2,119 Norm</text>
  <text x="465" y="418" fill="#fef3c7" font-size="10" font-weight="700" text-anchor="middle">₹1,636 Cr</text>
  <text x="465" y="432" fill="#fde68a" font-size="8.5" text-anchor="middle">FY26 Reported</text>

  <!-- 4. Q1 FY27 Run-Rate: ₹1,075 Cr x 4 = ₹4,300 Cr -> H=215, Y=265 -->
  <rect x="575" y="265" width="60" height="215" rx="4" fill="url(#patBar)" stroke="#10b981" stroke-width="1.5"/>
  <text x="605" y="284" fill="#ecfdf5" font-size="10.5" font-weight="700" text-anchor="middle">₹1,075 Cr</text>
  <text x="605" y="298" fill="#a7f3d0" font-size="9" text-anchor="middle">Q1'27 (₹4.3k Ann)</text>

  <!-- 5. Q2 FY27 Run-Rate: ₹1,045 Cr (H1 = ₹2,120 Cr -> ₹4,240 Cr Ann) -> H=212, Y=268 -->
  <rect x="685" y="268" width="60" height="212" rx="4" fill="url(#patBar)" stroke="#10b981" stroke-width="1.5"/>
  <text x="715" y="287" fill="#ecfdf5" font-size="10.5" font-weight="700" text-anchor="middle">₹1,045 Cr</text>
  <text x="715" y="301" fill="#a7f3d0" font-size="9" text-anchor="middle">Q2'27 (H1: ₹2,120)</text>

  <!-- 6. Full Year FY27E Projected (PAT: ₹4,350 Cr -> H=218, Y=262) -->
  <rect x="785" y="262" width="60" height="218" rx="4" fill="url(#patBar)" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="815" y="281" fill="#ecfdf5" font-size="10.5" font-weight="700" text-anchor="middle">₹4,350 Cr</text>
  <text x="815" y="295" fill="#a7f3d0" font-size="9" text-anchor="middle">FY27E (BV ₹61.5)</text>

  <!-- 7. Full Year FY28E Projected (PAT: ₹5,950 Cr -> H=297, Y=183) -->
  <rect x="885" y="183" width="60" height="297" rx="4" fill="url(#patBar)" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="915" y="203" fill="#ecfdf5" font-size="10.5" font-weight="700" text-anchor="middle">₹5,950 Cr</text>
  <text x="915" y="217" fill="#a7f3d0" font-size="9" text-anchor="middle">FY28E (BV ₹69.5)</text>

  <!-- 200-DMA Curve -->
  <path d="M 155,315 Q 280,370 465,392 Q 605,385 715,368 Q 815,335 915,275" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="6,4"/>

  <!-- Target Price Band (2027-28: Rs 105 to Rs 125 -> Y=272 to Y=208) -->
  <rect x="755" y="162" width="205" height="46" rx="8" fill="url(#targetZone)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="857" y="181" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle">2027–28 Target: ₹105 – ₹125</text>
  <text x="857" y="196" fill="#93c5fd" font-size="9.8" text-anchor="middle">(1.6x–1.8x FY28E BVPS ₹69.50)</text>

  <!-- Stock Price Line -->
  <!-- Points: FY24 Peak Rs 98 (Y=294), FY25 Drop Rs 63 (Y=406), H2 FY26 Base Rs 61 (Y=413), Q1 FY27 Rs 72 (Y=378), Q2 FY27 Rs 76 (Y=365), FY27E Rs 94 (Y=307), FY28E Target Mid Rs 115 (Y=240) -->
  <polyline points="155,294 310,406 465,413 605,378 715,365" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <polyline points="715,365 815,307 915,240" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-dasharray="7,5"/>

  <!-- Data Nodes & Callout Badges on Stock Price Line -->
  <!-- Point 1: Sep '23 - Early '24 Peak -->
  <circle cx="155" cy="294" r="6" fill="#ef4444" stroke="#fff" stroke-width="2"/>
  <rect x="98" y="242" width="124" height="38" rx="5" fill="#1e293b" stroke="#ef4444" filter="url(#shadow)"/>
  <text x="160" y="257" fill="#fca5a5" font-size="10.5" font-weight="700" text-anchor="middle">₹95–₹100 Peak</text>
  <text x="160" y="271" fill="#cbd5e1" font-size="9.2" text-anchor="middle">~2.1x P/B | PAT ₹2,957 Cr</text>

  <!-- Point 2: FY25 MFI Crisis De-Rating -->
  <circle cx="310" cy="406" r="5.5" fill="#f97316" stroke="#fff" stroke-width="1.8"/>
  <rect x="245" y="346" width="130" height="36" rx="5" fill="#1e293b" stroke="#f97316" filter="url(#shadow)"/>
  <text x="310" y="361" fill="#fdba74" font-size="10" font-weight="700" text-anchor="middle">₹58–₹65 Trough</text>
  <text x="310" y="374" fill="#cbd5e1" font-size="9" text-anchor="middle">~1.1x P/B | MFI Stress</text>

  <!-- Point 3: Stage 1 Base & Fraud Absorption -->
  <circle cx="465" cy="413" r="6.5" fill="#eab308" stroke="#fff" stroke-width="2"/>
  <rect x="394" y="312" width="148" height="46" rx="5" fill="#1e293b" stroke="#eab308" filter="url(#shadow)"/>
  <text x="468" y="327" fill="#fde047" font-size="10" font-weight="700" text-anchor="middle">Q4'26: Absorbs ₹483 Cr</text>
  <text x="468" y="340" fill="#cbd5e1" font-size="9" text-anchor="middle">Post-Tax Chandigarh Fraud</text>
  <text x="468" y="352" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">₹7,500 Cr Raised @ ₹60</text>

  <!-- Point 4: Q1 FY27 Breakout -->
  <circle cx="605" cy="378" r="5.5" fill="#10b981" stroke="#fff" stroke-width="2"/>

  <!-- Point 5: Q2 FY27 CMP -->
  <circle cx="715" cy="365" r="7" fill="#10b981" stroke="#fff" stroke-width="2"/>
  <rect x="562" y="196" width="182" height="50" rx="5" fill="#064e3b" stroke="#10b981" filter="url(#shadow)"/>
  <text x="653" y="212" fill="#6ee7b7" font-size="10.5" font-weight="700" text-anchor="middle">CMP ₹74–₹78 (~1.32x P/B)</text>
  <text x="653" y="226" fill="#ecfdf5" font-size="9.5" text-anchor="middle">H1 FY27 PAT: ₹2,120 Cr (Record)</text>
  <text x="653" y="239" fill="#fde047" font-size="9.2" font-weight="700" text-anchor="middle">GNPA 1.32% | NNPA 0.40% (Best Ever)</text>
  <line x1="670" y1="246" x2="712" y2="358" stroke="#10b981" stroke-width="1.5"/>

  <!-- Point 6 & 7: FY27E & FY28E Target -->
  <circle cx="815" cy="307" r="5.5" fill="#38bdf8" stroke="#fff" stroke-width="1.8"/>
  <circle cx="915" cy="240" r="6.5" fill="#38bdf8" stroke="#fff" stroke-width="2"/>

  <!-- X-Axis Labels -->
  <text x="155" y="502" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">FY24 (Peak)</text>
  <text x="155" y="516" fill="#94a3b8" font-size="9.5" text-anchor="middle">(2.1x P/B | ROA 1.10%)</text>

  <text x="310" y="502" fill="#fdba74" font-size="11" font-weight="600" text-anchor="middle">FY25 (MFI Shock)</text>
  <text x="310" y="516" fill="#94a3b8" font-size="9.5" text-anchor="middle">(1.1x P/B | ROA 0.48%)</text>

  <text x="465" y="502" fill="#fde047" font-size="11" font-weight="600" text-anchor="middle">FY26 (Clean-Up)</text>
  <text x="465" y="516" fill="#facc15" font-size="9.5" text-anchor="middle">(Fraud Provisioned | ₹60 CCPS)</text>

  <text x="605" y="502" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">Q1 FY27</text>
  <text x="605" y="516" fill="#34d399" font-size="9.5" text-anchor="middle">(₹1,075 Cr Record PAT)</text>

  <text x="715" y="502" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">Q2 FY27</text>
  <text x="715" y="516" fill="#34d399" font-size="9.5" text-anchor="middle">(₹1,045 Cr | 0.99% ROA)</text>

  <text x="815" y="502" fill="#93c5fd" font-size="11" font-weight="600" text-anchor="middle">FY27E</text>
  <text x="815" y="516" fill="#60a5fa" font-size="9.5" text-anchor="middle">(BVPS ₹61.50)</text>

  <text x="915" y="502" fill="#93c5fd" font-size="11" font-weight="700" text-anchor="middle">FY28E Target</text>
  <text x="915" y="516" fill="#60a5fa" font-size="9.5" text-anchor="middle">(BVPS ₹69.50 | ROA 1.28%)</text>

  <!-- Footer Key Takeaway Strip -->
  <rect x="36" y="532" width="978" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="525" y="552" fill="#e2e8f0" font-size="10.8" text-anchor="middle">
    <tspan fill="#38bdf8" font-weight="700">Core Setup:</tspan> IDFC First generated more reported PAT in H1 FY27 alone (₹2,120 Cr) than in all of FY25 (₹1,525 Cr) or FY26 (₹1,636 Cr), yet trades at ~1.32x P/B vs 2.1x in FY24.
  </text>
</svg>
