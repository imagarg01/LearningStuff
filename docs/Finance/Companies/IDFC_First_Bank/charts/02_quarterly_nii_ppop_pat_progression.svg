<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 560" width="100%" height="100%" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="niiBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="ppopBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="patBar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1050" height="560" rx="14" fill="url(#bgGrad2)" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="40" fill="#f8fafc" font-size="19.5" font-weight="700">IDFC First Bank Quarterly Progression: NII, Core PPOP, Credit Cost Normalization &amp; Record ₹1,000+ Cr PAT</text>
  <text x="36" y="63" fill="#94a3b8" font-size="12.5">Operating leverage J-curve (Core C/I down from 73.8% &#8594; 70.16%; Incremental C/I 55%) + Credit Cost halving (2.69% &#8594; 1.38%) drove back-to-back ₹1,000+ Cr PAT.</text>

  <!-- Legend -->
  <rect x="36" y="79" width="13" height="13" rx="3" fill="url(#niiBar)" stroke="#60a5fa"/>
  <text x="55" y="90" fill="#cbd5e1" font-size="11.5" font-weight="600">Net Interest Income (NII, ₹ Cr)</text>

  <rect x="255" y="79" width="13" height="13" rx="3" fill="url(#ppopBar)" stroke="#a78bfa"/>
  <text x="274" y="90" fill="#cbd5e1" font-size="11.5" font-weight="600">Core PPOP (Ex-Treasury, ₹ Cr)</text>

  <rect x="470" y="79" width="13" height="13" rx="3" fill="url(#patBar2)" stroke="#34d399"/>
  <text x="489" y="90" fill="#cbd5e1" font-size="11.5" font-weight="600">Net Profit (PAT, ₹ Cr)</text>

  <line x1="650" y1="85" x2="682" y2="85" stroke="#ef4444" stroke-width="3"/>
  <circle cx="666" cy="85" r="4.5" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
  <text x="690" y="90" fill="#fca5a5" font-size="11.5" font-weight="700">Credit Cost (% of Funded Assets — Right Axis)</text>

  <!-- Grid Lines (Left Y-Axis: ₹0 Cr at Y=460 to ₹7,000 Cr at Y=110 -> 0.05px per Cr; ₹1,400 Cr per 70px) -->
  <!-- Right Y-Axis: Credit Cost % from 0.50% at Y=460 to 3.00% at Y=110 -> 140px per 1.00% -->
  <g stroke="#334155" stroke-width="1">
    <line x1="85" y1="460" x2="965" y2="460"/>
    <line x1="85" y1="390" x2="965" y2="390" stroke-dasharray="3,3"/>
    <line x1="85" y1="320" x2="965" y2="320" stroke-dasharray="3,3"/>
    <line x1="85" y1="250" x2="965" y2="250" stroke-dasharray="3,3"/>
    <line x1="85" y1="180" x2="965" y2="180" stroke-dasharray="3,3"/>
    <line x1="85" y1="110" x2="965" y2="110" stroke-dasharray="3,3"/>
  </g>

  <!-- Left Y-Axis Labels (₹ Cr) -->
  <text x="76" y="464" fill="#94a3b8" font-size="11" text-anchor="end">₹0</text>
  <text x="76" y="394" fill="#94a3b8" font-size="11" text-anchor="end">₹1,400</text>
  <text x="76" y="324" fill="#94a3b8" font-size="11" text-anchor="end">₹2,800</text>
  <text x="76" y="254" fill="#94a3b8" font-size="11" text-anchor="end">₹4,200</text>
  <text x="76" y="184" fill="#94a3b8" font-size="11" text-anchor="end">₹5,600</text>
  <text x="76" y="114" fill="#94a3b8" font-size="11" text-anchor="end">₹7,000 Cr</text>
  <text x="24" y="285" fill="#93c5fd" font-size="12" font-weight="700" transform="rotate(-90 24,285)" text-anchor="middle">Quarterly NII / Core PPOP / PAT (₹ Crore)</text>

  <!-- Right Y-Axis Labels (Credit Cost %) -->
  <text x="974" y="464" fill="#fca5a5" font-size="11">0.50%</text>
  <text x="974" y="394" fill="#fca5a5" font-size="11">1.00%</text>
  <text x="974" y="324" fill="#fca5a5" font-size="11">1.50%</text>
  <text x="974" y="254" fill="#fca5a5" font-size="11">2.00%</text>
  <text x="974" y="184" fill="#fca5a5" font-size="11">2.50%</text>
  <text x="974" y="114" fill="#fca5a5" font-size="11">3.00%</text>
  <text x="1034" y="285" fill="#ef4444" font-size="12" font-weight="700" transform="rotate(90 1034,285)" text-anchor="middle">Credit Cost (% of Funded Assets)</text>

  <!-- Highlight Box for H1 FY27 Inflection (Q1 & Q2 FY27) -->
  <rect x="705" y="102" width="252" height="358" rx="6" fill="#10b981" fill-opacity="0.06" stroke="#10b981" stroke-opacity="0.35" stroke-dasharray="4,4"/>
  <text x="831" y="120" fill="#6ee7b7" font-size="10.5" font-weight="800" text-anchor="middle">H1 FY27 BREAKOUT: ₹2,120 Cr PAT</text>

  <!-- 7 Quarterly Clusters at X centers: 148, 272, 396, 520, 644, 768, 892 -->
  <!-- Each cluster has 3 bars: NII (x-42, w=26), Core PPOP (x-13, w=26), PAT (x+16, w=26) -->

  <!-- Q4 FY25 (X=148): NII 4,907 (H=245, Y=215), PPOP ~1,790 (H=90, Y=370), PAT 304 (H=15, Y=445) -->
  <rect x="106" y="215" width="26" height="245" rx="3" fill="url(#niiBar)" stroke="#60a5fa"/>
  <text x="119" y="208" fill="#93c5fd" font-size="9.5" font-weight="700" text-anchor="middle">4,907</text>
  <rect x="135" y="370" width="26" height="90" rx="3" fill="url(#ppopBar)" stroke="#a78bfa"/>
  <text x="148" y="363" fill="#c4b5fd" font-size="9.5" font-weight="700" text-anchor="middle">1,790</text>
  <rect x="164" y="445" width="26" height="15" rx="2" fill="url(#patBar2)" stroke="#34d399"/>
  <text x="177" y="439" fill="#6ee7b7" font-size="9.5" font-weight="700" text-anchor="middle">304</text>

  <!-- Q1 FY26 (X=272): NII 4,933 (H=247, Y=213), PPOP 1,744 (H=87, Y=373), PAT 463 (H=23, Y=437) -->
  <rect x="230" y="213" width="26" height="247" rx="3" fill="url(#niiBar)" stroke="#60a5fa"/>
  <text x="243" y="206" fill="#93c5fd" font-size="9.5" font-weight="700" text-anchor="middle">4,933</text>
  <rect x="259" y="373" width="26" height="87" rx="3" fill="url(#ppopBar)" stroke="#a78bfa"/>
  <text x="272" y="366" fill="#c4b5fd" font-size="9.5" font-weight="700" text-anchor="middle">1,744</text>
  <rect x="288" y="437" width="26" height="23" rx="2" fill="url(#patBar2)" stroke="#34d399"/>
  <text x="301" y="431" fill="#6ee7b7" font-size="9.5" font-weight="700" text-anchor="middle">463</text>

  <!-- Q2 FY26 (X=396): NII 5,113 (H=256, Y=204), PPOP 1,825 (H=91, Y=369), PAT 352 (H=18, Y=442) -->
  <rect x="354" y="204" width="26" height="256" rx="3" fill="url(#niiBar)" stroke="#60a5fa"/>
  <text x="367" y="197" fill="#93c5fd" font-size="9.5" font-weight="700" text-anchor="middle">5,113</text>
  <rect x="383" y="369" width="26" height="91" rx="3" fill="url(#ppopBar)" stroke="#a78bfa"/>
  <text x="396" y="362" fill="#c4b5fd" font-size="9.5" font-weight="700" text-anchor="middle">1,825</text>
  <rect x="412" y="442" width="26" height="18" rx="2" fill="url(#patBar2)" stroke="#34d399"/>
  <text x="425" y="436" fill="#6ee7b7" font-size="9.5" font-weight="700" text-anchor="middle">352</text>

  <!-- Q3 FY26 (X=520): NII 5,492 (H=275, Y=185), PPOP 2,012 (H=101, Y=359), PAT 503 (H=25, Y=435) -->
  <rect x="478" y="185" width="26" height="275" rx="3" fill="url(#niiBar)" stroke="#60a5fa"/>
  <text x="491" y="178" fill="#93c5fd" font-size="9.5" font-weight="700" text-anchor="middle">5,492</text>
  <rect x="507" y="359" width="26" height="101" rx="3" fill="url(#ppopBar)" stroke="#a78bfa"/>
  <text x="520" y="352" fill="#c4b5fd" font-size="9.5" font-weight="700" text-anchor="middle">2,012</text>
  <rect x="536" y="435" width="26" height="25" rx="2" fill="url(#patBar2)" stroke="#34d399"/>
  <text x="549" y="429" fill="#6ee7b7" font-size="9.5" font-weight="700" text-anchor="middle">503</text>

  <!-- Q4 FY26 (X=644): NII 5,678 (H=284, Y=176), PPOP 2,165 (H=108, Y=352), PAT 319 Rep / 746 Norm (H=16 Rep, 37 Norm) -->
  <rect x="602" y="176" width="26" height="284" rx="3" fill="url(#niiBar)" stroke="#60a5fa"/>
  <text x="615" y="169" fill="#93c5fd" font-size="9.5" font-weight="700" text-anchor="middle">5,678</text>
  <rect x="631" y="352" width="26" height="108" rx="3" fill="url(#ppopBar)" stroke="#a78bfa"/>
  <text x="644" y="345" fill="#c4b5fd" font-size="9.5" font-weight="700" text-anchor="middle">2,165</text>
  <!-- Norm PAT ghost bar -->
  <rect x="660" y="423" width="26" height="21" rx="2" fill="#fde047" fill-opacity="0.28" stroke="#fde047" stroke-dasharray="2,2"/>
  <rect x="660" y="444" width="26" height="16" rx="2" fill="url(#patBar2)" stroke="#34d399"/>
  <text x="673" y="405" fill="#fde047" font-size="8.5" font-weight="700" text-anchor="middle">746*</text>
  <text x="673" y="416" fill="#6ee7b7" font-size="9" font-weight="700" text-anchor="middle">319</text>

  <!-- Q1 FY27 (X=768): NII 5,972 (H=299, Y=161), PPOP 2,371 (H=119, Y=341), PAT 1,075 (H=54, Y=406) -->
  <rect x="726" y="161" width="26" height="299" rx="3" fill="url(#niiBar)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="739" y="153" fill="#93c5fd" font-size="10" font-weight="800" text-anchor="middle">5,972</text>
  <rect x="755" y="341" width="26" height="119" rx="3" fill="url(#ppopBar)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="768" y="333" fill="#c4b5fd" font-size="10" font-weight="800" text-anchor="middle">2,371</text>
  <rect x="784" y="406" width="26" height="54" rx="3" fill="url(#patBar2)" stroke="#34d399" stroke-width="1.8"/>
  <text x="797" y="398" fill="#6ee7b7" font-size="10.5" font-weight="800" text-anchor="middle">1,075</text>

  <!-- Q2 FY27 (X=892): NII 6,184 (H=309, Y=151), PPOP 2,527 (H=126, Y=334), PAT 1,045 (H=52, Y=408) -->
  <rect x="850" y="151" width="26" height="309" rx="3" fill="url(#niiBar)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="863" y="143" fill="#93c5fd" font-size="10" font-weight="800" text-anchor="middle">6,184</text>
  <rect x="879" y="334" width="26" height="126" rx="3" fill="url(#ppopBar)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="892" y="326" fill="#c4b5fd" font-size="10" font-weight="800" text-anchor="middle">2,527</text>
  <rect x="908" y="408" width="26" height="52" rx="3" fill="url(#patBar2)" stroke="#34d399" stroke-width="1.8"/>
  <text x="921" y="400" fill="#6ee7b7" font-size="10.5" font-weight="800" text-anchor="middle">1,045</text>

  <!-- Credit Cost Trajectory Line (Right Y-Axis: Y = 460 - (val - 0.50)*140) -->
  <!-- Q4 FY25: 2.38% (Y=197), Q1 FY26: 2.69% Peak (Y=153), Q2 FY26: 2.24% (Y=216), Q3 FY26: 2.05% (Y=243), Q4 FY26: 1.63% (Y=302), Q1 FY27: 1.42% (Y=331), Q2 FY27: 1.38% funded / 1.01% avg assets (Y=337) -->
  <polyline points="148,197 272,153 396,216 520,243 644,302 768,331 892,337" fill="none" stroke="#ef4444" stroke-width="3.2"/>

  <!-- Credit Cost Nodes & Labels -->
  <circle cx="148" cy="197" r="5" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
  <text x="148" y="185" fill="#fca5a5" font-size="10" font-weight="700" text-anchor="middle">2.38%</text>

  <circle cx="272" cy="153" r="6" fill="#ef4444" stroke="#fff" stroke-width="2"/>
  <rect x="212" y="114" width="120" height="30" rx="4" fill="#1e293b" stroke="#ef4444" filter="url(#shadow2)"/>
  <text x="272" y="127" fill="#fca5a5" font-size="10" font-weight="800" text-anchor="middle">2.69% Peak</text>
  <text x="272" y="139" fill="#cbd5e1" font-size="8.8" text-anchor="middle">(MFI Slippage Crest)</text>

  <circle cx="396" cy="216" r="5" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
  <text x="415" y="212" fill="#fca5a5" font-size="10" font-weight="700">2.24%</text>

  <circle cx="520" cy="243" r="5" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
  <text x="539" y="239" fill="#fca5a5" font-size="10" font-weight="700">2.05%</text>

  <circle cx="644" cy="302" r="5" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
  <text x="665" y="298" fill="#fde047" font-size="10" font-weight="700">1.63%</text>

  <circle cx="768" cy="331" r="5.5" fill="#10b981" stroke="#fff" stroke-width="1.8"/>
  <text x="768" y="317" fill="#6ee7b7" font-size="10" font-weight="700" text-anchor="middle">1.42%</text>

  <circle cx="892" cy="337" r="6" fill="#10b981" stroke="#fff" stroke-width="2"/>
  <rect x="772" y="246" width="178" height="40" rx="5" fill="#064e3b" stroke="#10b981" filter="url(#shadow2)"/>
  <text x="861" y="262" fill="#6ee7b7" font-size="10" font-weight="800" text-anchor="middle">Q2'27: ~1.38% of Funded</text>
  <text x="861" y="276" fill="#ecfdf5" font-size="9.2" font-weight="600" text-anchor="middle">(Only 1.01% of Avg Assets!)</text>
  <line x1="882" y1="286" x2="892" y2="330" stroke="#10b981" stroke-width="1.5"/>

  <!-- Callout Badge for Core C/I Compression -->
  <rect x="370" y="114" width="315" height="44" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="527" y="131" fill="#c4b5fd" font-size="10.8" font-weight="800" text-anchor="middle">Operating Leverage J-Curve Inflection</text>
  <text x="527" y="147" fill="#e2e8f0" font-size="9.6" text-anchor="middle">Core C/I Ratio: <tspan fill="#fca5a5" font-weight="700">73.8% (Q1'26)</tspan> &#8594; <tspan fill="#6ee7b7" font-weight="700">70.16% (Q2'27)</tspan> | H1 Incr. C/I: <tspan fill="#fde047" font-weight="700">55%</tspan></text>

  <!-- X-Axis Quarter Labels -->
  <text x="148" y="480" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Q4 FY25</text>
  <text x="148" y="494" fill="#94a3b8" font-size="9.5" text-anchor="middle">(Mar '25)</text>

  <text x="272" y="480" fill="#fca5a5" font-size="11" font-weight="600" text-anchor="middle">Q1 FY26</text>
  <text x="272" y="494" fill="#f87171" font-size="9.5" text-anchor="middle">(Cr. Cost Peak)</text>

  <text x="396" y="480" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Q2 FY26</text>
  <text x="396" y="494" fill="#94a3b8" font-size="9.5" text-anchor="middle">(Sep '25)</text>

  <text x="520" y="480" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Q3 FY26</text>
  <text x="520" y="494" fill="#94a3b8" font-size="9.5" text-anchor="middle">(Dec '25)</text>

  <text x="644" y="480" fill="#fde047" font-size="11" font-weight="600" text-anchor="middle">Q4 FY26*</text>
  <text x="644" y="494" fill="#facc15" font-size="9.2" text-anchor="middle">(*₹746 Cr Norm PAT)</text>

  <text x="768" y="480" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">Q1 FY27 (Record)</text>
  <text x="768" y="494" fill="#34d399" font-size="9.5" text-anchor="middle">(NII +21.1% | PPOP +36%)</text>

  <text x="892" y="480" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">Q2 FY27 (Sep '26)</text>
  <text x="892" y="494" fill="#34d399" font-size="9.5" text-anchor="middle">(NII +21.0% | PPOP +38.5%)</text>

  <!-- Footer Strip -->
  <rect x="36" y="512" width="978" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="525" y="532" fill="#e2e8f0" font-size="10.8" text-anchor="middle">
    <tspan fill="#6ee7b7" font-weight="700">Double Engine P&amp;L Expansion:</tspan> In Q2 FY27, Core PPOP surged +38.5% YoY to ₹2,527 Cr while provisions fell, driving a +197% YoY jump in PAT to ₹1,045 Cr.
  </text>
</svg>
