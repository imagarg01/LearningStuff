<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 530" width="100%" height="100%" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrowFlow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1050" height="530" rx="14" fill="url(#bgGrad3)" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="40" fill="#f8fafc" font-size="19.5" font-weight="700">The Banking Liability-to-Asset Value Chain: How IDFC First Crossed the Wholesale DFI Valley of Death</text>
  <text x="36" y="63" fill="#94a3b8" font-size="12.6">Only 2 institutions in modern Indian banking (Kotak &amp; IDFC First) survived converting a wholesale DFI with 8.7% CASA into a ~50% CASA retail fortress.</text>

  <!-- COLUMN 1: LEFT — LIABILITY MOAT (RAW MATERIAL) -->
  <rect x="34" y="88" width="305" height="382" rx="10" fill="#0f172a" fill-opacity="0.75" stroke="#3b82f6" stroke-width="1.8"/>
  <rect x="34" y="88" width="305" height="36" rx="8" fill="#1e3a8a"/>
  <text x="186" y="111" fill="#93c5fd" font-size="13" font-weight="800" text-anchor="middle">1. LIABILITY MOAT (RAW MATERIAL)</text>

  <!-- Legacy 2018 Box -->
  <rect x="48" y="138" width="277" height="106" rx="7" fill="#1e1b2e" stroke="#ef4444" stroke-width="1.4"/>
  <text x="60" y="158" fill="#fca5a5" font-size="11.5" font-weight="800">DEC 2018 LEGACY (Wholesale DFI Trap)</text>
  <text x="60" y="177" fill="#e2e8f0" font-size="10.2">• <tspan fill="#fca5a5" font-weight="700">CASA Ratio: 8.68%</tspan> (₹10,400 Cr total CASA)</text>
  <text x="60" y="194" fill="#e2e8f0" font-size="10.2">• <tspan fill="#fca5a5" font-weight="700">₹28,000+ Cr Legacy Infra Bonds</tspan> @ 8.5%–9.0%</text>
  <text x="60" y="211" fill="#e2e8f0" font-size="10.2">• Heavy reliance on fragile wholesale CDs/CPs</text>
  <text x="60" y="229" fill="#f87171" font-size="9.6" font-weight="600">✗ High Cost of Funds starved NIM &amp; forced risk</text>

  <!-- Downward Transformation Arrow inside Column 1 -->
  <line x1="186" y1="246" x2="186" y2="270" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <rect x="106" y="248" width="160" height="18" rx="4" fill="#064e3b" stroke="#10b981"/>
  <text x="186" y="260" fill="#6ee7b7" font-size="9.2" font-weight="700" text-anchor="middle">8-Yr Deposit Compounding</text>

  <!-- Q2 FY27 Fortress Box -->
  <rect x="48" y="276" width="277" height="180" rx="7" fill="#062e26" stroke="#10b981" stroke-width="1.8"/>
  <text x="60" y="297" fill="#6ee7b7" font-size="11.5" font-weight="800">Q2 FY27 FORTRESS (Sep 30, 2026)</text>
  <text x="60" y="317" fill="#ecfdf5" font-size="10.3">• <tspan fill="#fde047" font-weight="700">Total Deposits: ₹3,48,583 Cr</tspan> (+26% YoY)</text>
  <text x="60" y="335" fill="#ecfdf5" font-size="10.3">• <tspan fill="#6ee7b7" font-weight="700">Domestic CASA: ~50%</tspan> (43.47% Reported</text>
  <text x="60" y="350" fill="#a7f3d0" font-size="9.5">  incl. FCNR | ₹1,56,053 Cr CASA, +16.4% YoY)</text>
  <text x="60" y="369" fill="#ecfdf5" font-size="10.3">• <tspan fill="#38bdf8" font-weight="700">NRI FCNR(B) Surge: ₹34,390 Cr ($3.6B)</tspan></text>
  <text x="60" y="384" fill="#cbd5e1" font-size="9.5">  captured during Sep–Nov '26 RBI window</text>
  <text x="60" y="403" fill="#ecfdf5" font-size="10.3">• <tspan fill="#fde047" font-weight="700">Legacy 8.8% Infra Bonds: ₹0</tspan> (Fully retired</text>
  <text x="60" y="418" fill="#a7f3d0" font-size="9.5">  in FY26, unlocking structural CoF tailwind)</text>
  <text x="60" y="440" fill="#6ee7b7" font-size="10" font-weight="700">✓ Cost of Funds: ~6.0% | LCR: ~116%</text>

  <!-- Flow Arrow Col 1 -> Col 2 -->
  <line x1="339" y1="280" x2="369" y2="280" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowFlow)"/>

  <!-- COLUMN 2: CENTER — THE CORE PROCESSING ENGINE -->
  <rect x="373" y="88" width="304" height="382" rx="10" fill="#0f172a" fill-opacity="0.75" stroke="#8b5cf6" stroke-width="1.8"/>
  <rect x="373" y="88" width="304" height="36" rx="8" fill="#4c1d95"/>
  <text x="525" y="111" fill="#ddd6fe" font-size="13" font-weight="800" text-anchor="middle">2. CORE OPERATING ENGINE (J-CURVE)</text>

  <!-- Spread & Fee Box -->
  <rect x="387" y="138" width="276" height="132" rx="7" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="400" y="158" fill="#93c5fd" font-size="11.5" font-weight="800">A. HIGH-MARGIN REVENUE ENGINE</text>
  <text x="400" y="178" fill="#f8fafc" font-size="10.3">• <tspan fill="#fde047" font-weight="700">Net Interest Margin: 5.60% – 6.00%</tspan></text>
  <text x="400" y="193" fill="#cbd5e1" font-size="9.5">  (Industry-leading spread on retail asset mix)</text>
  <text x="400" y="212" fill="#f8fafc" font-size="10.3">• <tspan fill="#6ee7b7" font-weight="700">Q2 FY27 NII: ₹6,184 Cr</tspan> (+21.0% YoY)</text>
  <text x="400" y="231" fill="#f8fafc" font-size="10.3">• <tspan fill="#38bdf8" font-weight="700">Fee Income: ₹2,285 Cr/qtr</tspan> (+21% YoY)</text>
  <text x="400" y="248" fill="#a7f3d0" font-size="9.6" font-weight="600">  92% Granular Retail Fees (Cards, Wealth, FX,</text>
  <text x="400" y="261" fill="#a7f3d0" font-size="9.6" font-weight="600">  FASTag #1 issuer, Cash Mgmt — 0% Corp. Bulge)</text>

  <!-- Operating Leverage Box -->
  <rect x="387" y="284" width="276" height="172" rx="7" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="400" y="304" fill="#c4b5fd" font-size="11.5" font-weight="800">B. THE COST-TO-INCOME J-CURVE</text>
  <text x="400" y="324" fill="#f8fafc" font-size="10.2">• <tspan fill="#fde047" font-weight="700">1,000+ Branches Maturing:</tspan> Deposit/branch</text>
  <text x="400" y="339" fill="#cbd5e1" font-size="9.5">  scaling past ₹340 Cr without proportional staff</text>
  <text x="400" y="358" fill="#f8fafc" font-size="10.2">• <tspan fill="#6ee7b7" font-weight="700">Credit Cards (&gt;5M Cards in Force):</tspan></text>
  <text x="400" y="373" fill="#cbd5e1" font-size="9.5">  Broke even in FY25; Card C/I compressing</text>
  <text x="400" y="388" fill="#cbd5e1" font-size="9.5">  rapidly into mid-60s as spend scales</text>
  <text x="400" y="407" fill="#f8fafc" font-size="10.2">• <tspan fill="#38bdf8" font-weight="700">Core C/I Ratio: 73.8% &#8594; 70.16%</tspan> (Q2'27)</text>
  <rect x="398" y="418" width="254" height="28" rx="4" fill="#064e3b" stroke="#10b981"/>
  <text x="525" y="436" fill="#6ee7b7" font-size="10.2" font-weight="800" text-anchor="middle">H1 FY27 Incremental C/I Ratio: 55.0%!</text>

  <!-- Flow Arrow Col 2 -> Col 3 -->
  <line x1="677" y1="280" x2="707" y2="280" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- COLUMN 3: RIGHT — GRANULAR ASSET DEPLOYMENT -->
  <rect x="711" y="88" width="305" height="382" rx="10" fill="#0f172a" fill-opacity="0.75" stroke="#10b981" stroke-width="1.8"/>
  <rect x="711" y="88" width="305" height="36" rx="8" fill="#065f46"/>
  <text x="863" y="111" fill="#6ee7b7" font-size="13" font-weight="800" text-anchor="middle">3. GRANULAR ASSET DEPLOYMENT</text>

  <!-- Loan Book Mix Box -->
  <rect x="725" y="138" width="277" height="178" rx="7" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="738" y="158" fill="#6ee7b7" font-size="11.5" font-weight="800">₹3,46,913 Cr FUNDED ASSETS (+21.8% YoY)</text>
  <text x="738" y="178" fill="#f8fafc" font-size="10.2">• <tspan fill="#fde047" font-weight="700">~80% Retail, Rural &amp; MSME</tspan> diversified</text>
  <text x="738" y="193" fill="#cbd5e1" font-size="9.5">  across 25+ distinct product lines:</text>
  <text x="738" y="211" fill="#e2e8f0" font-size="9.8">  – Mortgages &amp; LAP (~28%): Prime secured</text>
  <text x="738" y="226" fill="#e2e8f0" font-size="9.8">  – Vehicle &amp; Consumer Loans (~24%): Bureau &gt;730</text>
  <text x="738" y="241" fill="#e2e8f0" font-size="9.8">  – MSME &amp; Enterprise (~22%): Cash-flow backed</text>
  <text x="738" y="256" fill="#e2e8f0" font-size="9.8">  – Corporate (Non-Infra ~19%): A/AA rated</text>
  <text x="738" y="276" fill="#6ee7b7" font-size="10" font-weight="700">• De-Risked Tail Exposures:</text>
  <text x="738" y="292" fill="#a7f3d0" font-size="9.5">  – <tspan fill="#fde047" font-weight="700">MFI Book shrunk to &lt;2.5%</tspan> (from &gt;6% in FY24)</text>
  <text x="738" y="306" fill="#a7f3d0" font-size="9.5">  – <tspan fill="#fde047" font-weight="700">Legacy Infrastructure &lt;1.0%</tspan> (from 19% in 2018)</text>

  <!-- Asset Quality Box -->
  <rect x="725" y="328" width="277" height="128" rx="7" fill="#062e26" stroke="#34d399" stroke-width="1.8"/>
  <text x="738" y="349" fill="#6ee7b7" font-size="11.5" font-weight="800">ALL-TIME BEST ASSET QUALITY (Q2 FY27)</text>
  <text x="738" y="370" fill="#ffffff" font-size="11" font-weight="700">• Gross NPA: <tspan fill="#fde047">1.32%</tspan> <tspan fill="#a7f3d0" font-size="9.5" font-weight="500">(Down 54 bps YoY)</tspan></text>
  <text x="738" y="389" fill="#ffffff" font-size="11" font-weight="700">• Net NPA: <tspan fill="#fde047">0.40%</tspan> <tspan fill="#a7f3d0" font-size="9.5" font-weight="500">(Down 12 bps YoY)</tspan></text>
  <text x="738" y="408" fill="#ecfdf5" font-size="10">• Retail/Rural/MSME GNPA: <tspan fill="#6ee7b7" font-weight="700">1.26%</tspan> | NNPA: <tspan fill="#6ee7b7" font-weight="700">0.39%</tspan></text>
  <text x="738" y="426" fill="#ecfdf5" font-size="10">• PCR: <tspan fill="#38bdf8" font-weight="700">70.11%</tspan> | Collection Efficiency: <tspan fill="#6ee7b7" font-weight="700">99.5%</tspan></text>
  <text x="738" y="444" fill="#fde047" font-size="9.8" font-weight="700">✓ Credit Demand Ratio (C/D) improved to ~94%</text>

  <!-- Footer Strip -->
  <rect x="34" y="484" width="982" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="525" y="504" fill="#e2e8f0" font-size="10.8" text-anchor="middle">
    <tspan fill="#fde047" font-weight="700">Structural Moat Verdict:</tspan> A fintech or NBFC can copy loan algorithms in 18 months; replicating ₹3.49 Lakh Cr of granular retail deposits across 1,000+ branches takes a decade.
  </text>
</svg>
